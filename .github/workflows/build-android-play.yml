name: Build Android Play Bundle（海外版 Stampday → Google Play）

# 海外安卓正式线（9-03 拍板：对齐 iOS 海外版）。跟 build-android.yml（中国版官网直装）同一套骨架，五处不同：
#   ① 服务器：WEB_BASE 换成 stampday（美服独立实例，照 build-ios.yml 那一步）
#   ② 包名：com.tybbtech.stampday（🔴 com.tybbtech.lifestamps 已用于备案，归中国线；两个包名互不覆盖）
#   ③ 显示名：Stampday（全球统一，跟 iOS 海外包一致）
#   ④ 产物：**AAB**（Play 新应用只收 bundle）+ 一份签好的 APK（真机旁装验收用，Play 上架前 Google 登录/购买只能这么测）
#   ⑤ 落点：AAB 传 Play 内部测试轨道（有服务账号 secret 才传；没有就只留 artifact，手动传 Play Console）
#      APK 传 _t/android-play.html 供旁装。
# 客户端按 WEB_BASE 自动切海外分支（net.js IS_OVERSEAS）：登录只有 Google、购买走 Play Billing、不查官网更新。
# 🔴 签名：AAB 用 jarsigner（apksigner 不签 bundle），APK 用 apksigner；同一个 keystore = Play 的**上传密钥**，
#    最终给用户的签名密钥由 Play App Signing 持有（建应用时勾上）。Google Cloud 的 Android OAuth client
#    要登记**两个** SHA-1：上传密钥的（凭证卡里那串）+ Play 签名密钥的（Play Console → 应用签名 页拿）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-play-v*'

permissions:
  contents: write

env:
  PLAY_PACKAGE: com.tybbtech.stampday
  PLAY_APP_NAME: Stampday

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor
        run: npm install

      # 🔴 只认 const 那一整行（跟 build-ios.yml 同一条教训：净靠 sed 静默失败过太多次）
      - name: Point app at overseas server (stampday)
        run: |
          sed -i "s|^const WEB_BASE = 'https://www.tybbtech.com/lifestamps/';|const WEB_BASE = 'https://stampday.tybbtech.com/lifestamps/';|" app/js/net.js
          grep -q "^const WEB_BASE = 'https://stampday.tybbtech.com/lifestamps/';" app/js/net.js
          grep -q "^export const IS_OVERSEAS = WEB_BASE.startsWith('https://stampday.');" app/js/net.js
          echo "WEB_BASE = 美服 stampday；IS_OVERSEAS 会推成 true"

      # 包名 + 显示名在 cap add 之前改 capacitor.config.json（cap add 按它生成 applicationId / app_name / Java 包目录）
      - name: Rename package & display name for Play
        run: |
          node -e "
            const fs=require('fs'); const f='capacitor.config.json';
            const c=JSON.parse(fs.readFileSync(f,'utf8'));
            c.appId=process.env.PLAY_PACKAGE; c.appName=process.env.PLAY_APP_NAME;
            fs.writeFileSync(f, JSON.stringify(c,null,2)+'\n');"
          grep -q "\"appId\": \"$PLAY_PACKAGE\"" capacitor.config.json
          grep -q "\"appName\": \"$PLAY_APP_NAME\"" capacitor.config.json
          cat capacitor.config.json

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
          # 先把实际生成的行打出来再断言（首跑就栽在这：namespace 的写法是 `namespace = "…"` 带等号）
          grep -nE "namespace|applicationId" android/app/build.gradle
          grep -qE "applicationId *=? *\"$PLAY_PACKAGE\"" android/app/build.gradle
          grep -qE "namespace *=? *\"$PLAY_PACKAGE\"" android/app/build.gradle
          MA=$(find android/app/src/main/java -name MainActivity.java | head -1)
          echo "MainActivity: $MA"
          test -n "$MA"
          grep -q "^package $PLAY_PACKAGE;" "$MA"
          echo "applicationId / namespace / Java 包 都是 $PLAY_PACKAGE"

      - name: Strip dev harnesses from the bundle
        run: |
          rm -rf android/app/src/main/assets/public/dev
          test ! -d android/app/src/main/assets/public/dev

      - name: Inject icons, splash, display name, version, orientation, billing permission
        run: |
          cp -R android-assets/res/. android/app/src/main/res/
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          S=android/app/src/main/res/values/strings.xml
          grep -q "<string name=\"app_name\">$PLAY_APP_NAME</string>" $S
          VERSION=$(node -p "require('./package.json').version")
          BUILD_NUM=$(git rev-list --count HEAD)
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode $BUILD_NUM/" $G
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" $G
          grep -q "versionCode $BUILD_NUM" $G
          grep -q "versionName \"$VERSION\"" $G
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:screenOrientation="portrait"#' $M
          grep -q 'android:screenOrientation="portrait"' $M
          # Play Billing 权限：插件的 manifest 一般会合并进来，但合并结果要到 aapt 才看得见；
          # 这里直接写进主 manifest，重复声明无害，漏了则购买面板拉不起来。
          if ! grep -q 'com.android.vending.BILLING' $M; then
            sed -i 's#<application#<uses-permission android:name="com.android.vending.BILLING" />\n    <application#' $M
          fi
          grep -q 'com.android.vending.BILLING' $M
          # 🔴 广告 ID（9-04）：Play 结算库会把 com.google.android.gms.permission.AD_ID
          #    连同一串 ACCESS_ADSERVICES_* 一起合并进主 manifest（Billing 7 的隐私沙盒归因那套）。
          #    我们**不用广告 ID**：无广告、无分析 SDK、无归因。留着它，Play Console 会拦住送审
          #    要求声明"本应用使用广告 ID"——那跟隐私政策的 "No ads, no third-party analytics or
          #    tracking SDKs" 和数据安全表（用途只勾了应用功能/账号管理）三处对不上。
          #    → 显式 remove。摘掉对功能零影响（结算和登录都不需要广告 ID）。
          #    ⚠️ 合并结果只有 aapt 看得见，所以下面出包那步有一条"成品里不许有 AD_ID"的断言。
          grep -q 'xmlns:tools' $M || sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' $M
          grep -q 'xmlns:tools' $M
          if ! grep -q 'permission.AD_ID' $M; then
            sed -i 's#<application#<uses-permission android:name="com.google.android.gms.permission.AD_ID" tools:node="remove" />\n    <application#' $M
          fi
          grep -q 'tools:node="remove"' $M
          echo "versionCode=$BUILD_NUM versionName=$VERSION"

      - name: Build release bundle (AAB) + APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon
          ls -l app/build/outputs/bundle/release/ app/build/outputs/apk/release/

      - name: Sign AAB (jarsigner) and APK (zipalign + apksigner)
        env:
          KS_B64: ${{ secrets.LS_ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.LS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LS_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LS_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS_B64"
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo -n "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks
          mkdir -p $RUNNER_TEMP/out
          # ---- AAB ----
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          cp "$AAB" "$RUNNER_TEMP/out/Stampday-v${VERSION}-${BUILD_NUM}.aab"
          jarsigner -keystore $RUNNER_TEMP/release.jks -storepass "$KS_PASS" -keypass "$KEY_PASS" \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            "$RUNNER_TEMP/out/Stampday-v${VERSION}-${BUILD_NUM}.aab" "$KEY_ALIAS"
          jarsigner -verify "$RUNNER_TEMP/out/Stampday-v${VERSION}-${BUILD_NUM}.aab"
          # ---- APK（旁装验收）----
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$UNSIGNED"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" $RUNNER_TEMP/aligned.apk
          "$BT/apksigner" sign --ks $RUNNER_TEMP/release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out $RUNNER_TEMP/out/Stampday-play.apk $RUNNER_TEMP/aligned.apk
          "$BT/apksigner" verify --print-certs $RUNNER_TEMP/out/Stampday-play.apk
          rm -f $RUNNER_TEMP/release.jks
          # 包名 / 显示名 / 版本号 用 aapt 从成品里读回来，不信 gradle 说的
          AAPT="$BT/aapt"
          "$AAPT" dump badging $RUNNER_TEMP/out/Stampday-play.apk | grep -E "^package:|application-label:" | head -3
          "$AAPT" dump badging $RUNNER_TEMP/out/Stampday-play.apk | grep -q "package: name='$PLAY_PACKAGE'"
          "$AAPT" dump badging $RUNNER_TEMP/out/Stampday-play.apk | grep -q "versionCode='$BUILD_NUM'"
          "$AAPT" dump badging $RUNNER_TEMP/out/Stampday-play.apk | grep -q "application-label:'$PLAY_APP_NAME'"
          "$AAPT" dump badging $RUNNER_TEMP/out/Stampday-play.apk | grep -q "com.android.vending.BILLING"
          # 🔴 反向断言：成品里**不许**有广告 ID 权限（见上面 manifest 那段）。
          #    这条只能对成品做——tools:node="remove" 是不是真生效，源文件里看不出来。
          "$AAPT" dump permissions $RUNNER_TEMP/out/Stampday-play.apk | grep -E "AD_ID|ADSERVICES" || true
          if "$AAPT" dump permissions $RUNNER_TEMP/out/Stampday-play.apk \
               | grep -q "com.google.android.gms.permission.AD_ID"; then
            echo "::error title=AD_ID 没摘掉::成品仍含 com.google.android.gms.permission.AD_ID，tools:node=remove 未生效"
            exit 1
          fi
          echo "AD_ID 权限已确认摘除"
          # 成品里的网页必须指美服（sed 静默失败的最后一道闸）
          unzip -p $RUNNER_TEMP/out/Stampday-play.apk assets/public/js/net.js | grep -q "^const WEB_BASE = 'https://stampday.tybbtech.com/lifestamps/';"
          echo "成品核对：包名/版本/显示名/BILLING/WEB_BASE 全对"
          ls -l $RUNNER_TEMP/out

      # ---- 旁装页（英文，放 _t/，网页部署脚本已 --exclude '_t/'）----
      - name: Generate android-play.html
        run: |
          BASE=https://www.tybbtech.com/lifestamps/_t
          SIZE=$(( $(stat -c %s $RUNNER_TEMP/out/Stampday-play.apk) / 1048576 ))
          cat > $RUNNER_TEMP/out/android-play.html <<HTML
          <!doctype html><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Stampday · Android (Play build)</title>
          <style>body{font:16px/1.8 system-ui,-apple-system;margin:0;padding:56px 24px;
          background:#EAE5DA;color:#252421;text-align:center}
          h1{font-size:22px;margin:0 0 6px}p{color:#8C8880;font-size:14px;margin:4px 0}
          a.install{display:inline-block;margin-top:28px;padding:14px 34px;background:#C94B3C;
          color:#fff;text-decoration:none;border-radius:10px;font-size:17px}
          .n{margin-top:34px;font-size:12px;color:#A79E92;line-height:1.9}</style>
          <h1>Stampday</h1>
          <p>Android test build (Play edition) v${VERSION} (build ${BUILD_NUM}) · about ${SIZE} MB</p>
          <p><a class="install" href="${BASE}/Stampday-play.apk">Download &amp; install</a></p>
          <div class="n">Open this page in the phone's browser, then tap the downloaded file to install.<br>
          Allow "install from unknown sources" the first time.<br>
          Package com.tybbtech.stampday — installs side by side with 戳了么, separate data.<br>
          Google sign-in works only once the upload-key SHA-1 is registered in Google Cloud.<br>
          Purchases need the Play internal-testing track (sideloaded builds can't bill).<br>
          中国版测试包在 <a href="android.html">android.html</a></div>
          HTML
          ls -l $RUNNER_TEMP/out/android-play.html

      - name: Deploy sideload APK to OTA dir (_t/)
        env:
          OTA_SSH_HOST: ${{ secrets.OTA_SSH_HOST }}
          OTA_SSH_PORT: ${{ secrets.OTA_SSH_PORT }}
          OTA_SSH_USER: ${{ secrets.OTA_SSH_USER }}
          OTA_SSH_PASSWORD: ${{ secrets.OTA_SSH_PASSWORD }}
        run: |
          python3 -m venv $RUNNER_TEMP/venv
          $RUNNER_TEMP/venv/bin/python -m pip install --quiet paramiko
          $RUNNER_TEMP/venv/bin/python ci/ota_deploy.py \
            $RUNNER_TEMP/out/Stampday-play.apk \
            $RUNNER_TEMP/out/android-play.html
          curl -sfI https://www.tybbtech.com/lifestamps/_t/Stampday-play.apk | head -1
          echo "::notice title=旁装地址::https://www.tybbtech.com/lifestamps/_t/android-play.html  (v${VERSION} / ${BUILD_NUM})"

      # ---- Play 内部测试轨道：有服务账号才传。⚠️ 应用的**第一个** bundle 必须在 Play Console 手动上传
      #      （API 不能建应用记录），之后的版本这里自动传。服务账号：Google Cloud 建 → Play Console
      #      用户和权限 里邀请它、给"发布到测试轨道"权限 → JSON 密钥整个存进 secret LS_PLAY_SERVICE_ACCOUNT_JSON。
      - name: Check Play service account
        env:
          SA: ${{ secrets.LS_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then echo "HAS_PLAY_SA=true" >> $GITHUB_ENV; echo "有服务账号：会传 Play 内部测试";
          else echo "HAS_PLAY_SA=false" >> $GITHUB_ENV; echo "::warning::没配 LS_PLAY_SERVICE_ACCOUNT_JSON，AAB 只留 artifact，手动传 Play Console"; fi

      - name: Upload AAB to Play internal testing
        if: env.HAS_PLAY_SA == 'true'
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.LS_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE }}
          releaseFiles: ${{ runner.temp }}/out/Stampday-v${{ env.VERSION }}-${{ env.BUILD_NUM }}.aab
          track: internal
          status: completed

      - name: Attach to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/android-play-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --generate-notes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release upload "$TAG" "$RUNNER_TEMP/out/Stampday-v${VERSION}-${BUILD_NUM}.aab" \
            "$RUNNER_TEMP/out/Stampday-play.apk" --clobber -R "$GITHUB_REPOSITORY"

      - name: Keep AAB + APK as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stampday-play-bundle
          path: |
            ${{ runner.temp }}/out/Stampday-v*.aab
            ${{ runner.temp }}/out/Stampday-play.apk
          retention-days: 30
          if-no-files-found: error
