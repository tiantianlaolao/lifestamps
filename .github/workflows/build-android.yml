name: Build Android Release APK & Publish（中国版正式包，官网直装）

# 打 android-vX.Y.Z 的 tag 触发（也可手动）。跟 build-android-test.yml 同一套构建，只有三处不同：
#   ① 落点 = /var/www/lifestamps/dl/（官网正式下载地址，网页部署脚本已 --exclude 'dl/'）
#   ② 多写一份 dl/android.json —— App 里「有新版本」检查读的就是它（main.js checkAndroidUpdate）
#   ③ tag 触发时把 APK 挂到 GitHub Release
# 🔴 安卓只做中国版（9-02 拍板）：连国内 www/1.13、登录只有手机号、显示名「戳了么」。海外安卓缓行。
on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor
        run: npm install

      - name: Assert app points at China server
        run: |
          grep -q "^const WEB_BASE = 'https://www.tybbtech.com/lifestamps/';" app/js/net.js
          echo "WEB_BASE = 国内 www（中国版）"

      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Strip dev harnesses from the bundle
        run: |
          rm -rf android/app/src/main/assets/public/dev
          test ! -d android/app/src/main/assets/public/dev

      - name: Inject icons, splash, display name, version, orientation
        run: |
          cp -R android-assets/res/. android/app/src/main/res/
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          S=android/app/src/main/res/values/strings.xml
          grep -q '<string name="app_name">戳了么</string>' $S
          VERSION=$(node -p "require('./package.json').version")
          BUILD_NUM=$(git rev-list --count HEAD)
          G=android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode $BUILD_NUM/" $G
          sed -i "s/versionName \"1.0\"/versionName \"$VERSION\"/" $G
          grep -q "versionCode $BUILD_NUM" $G
          grep -q "versionName \"$VERSION\"" $G
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "BUILD_NUM=$BUILD_NUM" >> $GITHUB_ENV
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity"\n            android:screenOrientation="portrait"#' $M
          grep -q 'android:screenOrientation="portrait"' $M

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK (zipalign + apksigner)
        env:
          KS_B64: ${{ secrets.LS_ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.LS_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LS_ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.LS_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KS_B64"
          BT=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          echo -n "$KS_B64" | base64 -d > $RUNNER_TEMP/release.jks
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$UNSIGNED"
          mkdir -p $RUNNER_TEMP/out
          "$BT/zipalign" -p -f 4 "$UNSIGNED" $RUNNER_TEMP/aligned.apk
          "$BT/apksigner" sign --ks $RUNNER_TEMP/release.jks --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS --key-pass env:KEY_PASS \
            --out $RUNNER_TEMP/out/chuoleme.apk $RUNNER_TEMP/aligned.apk
          "$BT/apksigner" verify --print-certs $RUNNER_TEMP/out/chuoleme.apk
          rm -f $RUNNER_TEMP/release.jks
          # 带版本号的归档名：固定名 chuoleme.apk 永远指最新，归档名留历史
          cp $RUNNER_TEMP/out/chuoleme.apk "$RUNNER_TEMP/out/chuoleme-v${VERSION}-${BUILD_NUM}.apk"
          ls -l $RUNNER_TEMP/out

      # App 里的更新检查读这份：versionCode 比自己大就提示。url 用固定名，不随版本变。
      - name: Write android.json
        run: |
          APK=$RUNNER_TEMP/out/chuoleme.apk
          SIZE=$(stat -c %s "$APK")
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          cat > $RUNNER_TEMP/out/android.json <<JSON
          {
            "versionCode": ${BUILD_NUM},
            "versionName": "${VERSION}",
            "url": "https://www.tybbtech.com/lifestamps/dl/chuoleme.apk",
            "archiveUrl": "https://www.tybbtech.com/lifestamps/dl/chuoleme-v${VERSION}-${BUILD_NUM}.apk",
            "size": ${SIZE},
            "sha256": "${SHA}",
            "date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          node -e "JSON.parse(require('fs').readFileSync('$RUNNER_TEMP/out/android.json','utf8')); console.log('android.json OK')"
          cat $RUNNER_TEMP/out/android.json

      - name: Deploy to official download dir (dl/)
        env:
          OTA_SSH_HOST: ${{ secrets.OTA_SSH_HOST }}
          OTA_SSH_PORT: ${{ secrets.OTA_SSH_PORT }}
          OTA_SSH_USER: ${{ secrets.OTA_SSH_USER }}
          OTA_SSH_PASSWORD: ${{ secrets.OTA_SSH_PASSWORD }}
          OTA_LIVE_DIR: /var/www/lifestamps/dl
        run: |
          python3 -m venv $RUNNER_TEMP/venv
          $RUNNER_TEMP/venv/bin/python -m pip install --quiet paramiko
          $RUNNER_TEMP/venv/bin/python ci/ota_deploy.py \
            $RUNNER_TEMP/out/chuoleme.apk \
            "$RUNNER_TEMP/out/chuoleme-v${VERSION}-${BUILD_NUM}.apk" \
            $RUNNER_TEMP/out/android.json

      - name: Verify public URLs
        run: |
          curl -sfI https://www.tybbtech.com/lifestamps/dl/chuoleme.apk | head -1
          curl -sf https://www.tybbtech.com/lifestamps/dl/android.json | grep -q "\"versionCode\": ${BUILD_NUM}"
          echo "::notice title=安卓正式包::https://www.tybbtech.com/lifestamps/dl/chuoleme.apk  (v${VERSION} / ${BUILD_NUM})"

      - name: Upload APK to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --generate-notes -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release upload "$TAG" "$RUNNER_TEMP/out/chuoleme-v${VERSION}-${BUILD_NUM}.apk" --clobber -R "$GITHUB_REPOSITORY"

      - name: Keep the APK as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: chuoleme-release-apk
          path: ${{ runner.temp }}/out/chuoleme-v*.apk
          retention-days: 30
          if-no-files-found: error
