<!doctype html><meta charset="utf-8"><title>刻章铺 · 颜色试验</title>
<!-- 9-11：用户问「荷花能不能保留原来的颜色」。A = 单色但取原色；B = 分 2~3 色叠印。dev 页，不进包。 -->
<style>
body{margin:0;background:#E9E4D8;font:12px/1.5 system-ui;padding:10px;width:1180px}
.r{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.c{background:#F6F2EA;border-radius:8px;padding:6px;text-align:center}
.p{background:#FBF7EE;height:180px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:6px;position:relative}
.p img{max-width:170px;max-height:170px}.m{color:#6B655C;font-size:11.5px;margin-top:4px}
.stack{position:relative}.stack>span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-3px;margin:0 2px;border:1px solid rgba(0,0,0,.15)}
</style><div id="out"></div>
<script type="module">
import { INKS } from '../js/data.js';
import { defsMarkup, stampSVG } from '../js/stamp.js';
import { imageToStamp } from '../js/trace.js';
import { prepare, magicWand, refineMask, thickenBin } from '../js/carve.js';
document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute">${defsMarkup()}</svg>`);
const load = s => new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = no; i.src = s; });
const crop = (img, x0, y0, x1, y1) => { const w = img.naturalWidth, h = img.naturalHeight, c = document.createElement('canvas'); c.width = Math.round((x1-x0)*w); c.height = Math.round((y1-y0)*h); c.getContext('2d').drawImage(img, x0*w, y0*h, c.width, c.height, 0, 0, c.width, c.height); return c; };
let inkN = 0;
const ink = hex => { const id = 'kzc' + (inkN++); INKS[id] = { name: id, type: 'solid', color: hex, free: true }; return id; };
const S = (d, size, inkId) => stampSVG({ id: 'x', name: 'x', cat: 'meet', ink: inkId, d }, { size, ink: inkId });
const hex = ([r, g, b]) => '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
const maskC = (w, h, on) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'), id = x.createImageData(w, h); for (let i = 0; i < w*h; i++) { const v = on(i) ? 0 : 255; id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = v; id.data[i*4+3] = 255; } x.putImageData(id, 0, 0); return c; };
function dropSmall(m, w, h, min) {   // 去掉小于 min 像素的碎块
  const lab = new Int32Array(w*h), keep = new Uint8Array(w*h); let id = 0;
  for (let s = 0; s < w*h; s++) { if (!m[s] || lab[s]) continue; id++; const st = [s], px = []; lab[s] = id;
    while (st.length) { const i = st.pop(); px.push(i); const x = i % w; for (const j of [x>0?i-1:-1, x<w-1?i+1:-1, i>=w?i-w:-1, i<w*(h-1)?i+w:-1]) if (j>=0 && m[j] && !lab[j]) { lab[j] = id; st.push(j); } }
    if (px.length >= min) for (const i of px) keep[i] = 1; }
  return keep;
}
// 选区内的颜色（从 2048 缩到 P 的尺寸取 RGB）
function selPixels(src, sel) {
  const c = document.createElement('canvas'); c.width = sel.w; c.height = sel.h; const x = c.getContext('2d', { willReadFrequently: true }); x.drawImage(src, 0, 0, sel.w, sel.h);
  return x.getImageData(0, 0, sel.w, sel.h).data;
}
// A：主色 = 选区里按饱和度加权的平均色，再往「印泥」方向压一点（降一点亮度、提一点饱和）
function mainColor(px, sel) {
  let r = 0, g = 0, b = 0, wsum = 0;
  for (let i = 0; i < sel.w * sel.h; i++) { if (!sel.mask[i]) continue; const R = px[i*4], G = px[i*4+1], B = px[i*4+2]; const mx = Math.max(R, G, B), mn = Math.min(R, G, B); const wgt = (mx - mn + 8) * (mx > 40 ? 1 : .2); r += R*wgt; g += G*wgt; b += B*wgt; wsum += wgt; }
  const c = [r/wsum, g/wsum, b/wsum]; const L = (c[0] + c[1] + c[2]) / 3;
  return c.map(v => (v - L) * 1.25 + L * .8);   // 提饱和、压亮度：印在纸上更像印泥
}
// B：k-means（RGB，k=3，选区内），每一簇一层
function kmeans(px, sel, k) {
  const pts = []; for (let i = 0; i < sel.w * sel.h; i++) if (sel.mask[i]) pts.push(i);
  let cs = []; for (let j = 0; j < k; j++) { const i = pts[Math.floor((j + .5) / k * pts.length)]; cs.push([px[i*4], px[i*4+1], px[i*4+2]]); }
  const asg = new Int8Array(sel.w * sel.h).fill(-1);
  for (let it = 0; it < 12; it++) {
    const sum = cs.map(() => [0, 0, 0, 0]);
    for (const i of pts) { let best = 0, bd = 1e12; for (let j = 0; j < k; j++) { const d = (px[i*4]-cs[j][0])**2 + (px[i*4+1]-cs[j][1])**2 + (px[i*4+2]-cs[j][2])**2; if (d < bd) { bd = d; best = j; } } asg[i] = best; const s = sum[best]; s[0] += px[i*4]; s[1] += px[i*4+1]; s[2] += px[i*4+2]; s[3]++; }
    cs = sum.map((s, j) => s[3] ? [s[0]/s[3], s[1]/s[3], s[2]/s[3]] : cs[j]);
  }
  return { cs, asg };
}
// 多层要对齐：每层都在选区包围盒的两个角放 1 像素的「钉子」，这样各层 imageToStamp 的缩放平移一样
function layered(sel, asg, k) {
  const { w, h, mask } = sel; let x0 = w, y0 = h, x1 = 0, y1 = 0;
  for (let i = 0; i < w*h; i++) if (mask[i]) { const x = i % w, y = (i - x) / w; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  const out = [];
  for (let j = 0; j < k; j++) {
    let m = new Uint8Array(w*h); for (let i = 0; i < w*h; i++) if (asg[i] === j) m[i] = 1;
    m = dropSmall(m, w, h, 40);
    m[y0*w + x0] = 1; m[y1*w + x1] = 1;
    out.push(imageToStamp(maskC(w, h, i => m[i]), { flatten: false, thr: 128, dropFrame: false, minArea: 0, eps: 1.4 }));
  }
  return out;
}
const cell = (title, inner, note) => `<div class="c"><div class="p">${inner}</div><div class="m"><b>${title}</b><br>${note || ''}</div></div>`;
async function run(label, file, box, taps) {
  const img = await load(file), c = crop(img, ...box), P = prepare(c), { w, h } = P;
  let m = new Uint8Array(w*h); for (const [fx, fy] of taps) { const s = magicWand(P, fx, fy); for (let i = 0; i < w*h; i++) if (s.mask[i]) m[i] = 1; }
  const sel = refineMask({ w, h, mask: m }), px = selPixels(c, sel);
  // 线稿（去背景后描）——现有做法
  const cc = document.createElement('canvas'); cc.width = w; cc.height = h; const cx = cc.getContext('2d'); const id = cx.createImageData(w, h);
  for (let i = 0; i < w*h; i++) { const on = sel.mask[i]; for (let q = 0; q < 3; q++) id.data[i*4+q] = on ? px[i*4+q] : 255; id.data[i*4+3] = 255; } cx.putImageData(id, 0, 0);
  const line = thickenBin(imageToStamp(cc, {}), 1);
  const main = mainColor(px, sel), mainInk = ink(hex(main));
  const { cs, asg } = kmeans(px, sel, 3);
  // 分色：按亮度从浅到深叠（浅的先盖、深的后盖），颜色往印泥压一点
  const order = cs.map((col, j) => ({ j, L: col[0] + col[1] + col[2] })).sort((a, b) => b.L - a.L);
  const layers = layered(sel, asg, 3);
  const inks = cs.map(col => { const L = (col[0] + col[1] + col[2]) / 3; return ink(hex(col.map(v => (v - L) * 1.2 + L * .85))); });
  const stack = size => `<div class="stack" style="width:${size}px;height:${size}px">${order.map(o => `<span>${S(layers[o.j].d, size, inks[o.j])}</span>`).join('')}</div>`;
  const kb = layers.reduce((a, l) => a + l.chars, 0) / 1024;
  document.getElementById('out').insertAdjacentHTML('beforeend', `<div class="r">
    ${cell(label, `<img src="${c.toDataURL('image/jpeg', .8)}">`, '裁切后的原图')}
    ${cell('现在：线稿 + 朱红', S(line.d, 150, 'zhu') + S(line.d, 30, 'zhu'), '')}
    ${cell('A · 线稿 + 取原色', S(line.d, 150, mainInk) + S(line.d, 30, mainInk), `取到的颜色 <span class="sw" style="background:${INKS[mainInk].color}"></span>`)}
    ${cell('B · 分 3 色叠印', stack(150) + stack(30), `三层颜色 ${inks.map(k => `<span class="sw" style="background:${INKS[k].color}"></span>`).join('')} · 共 ${kb.toFixed(0)}KB`)}
    ${cell('B · 分色（换成墨色系）', `<div class="stack" style="width:150px;height:150px">${order.map((o, n) => `<span style="opacity:${[.35, .65, 1][n]}">${S(layers[o.j].d, 150, 'mo')}</span>`).join('')}</div>`, '同一套分层，只用一种印泥的深浅')}
  </div>`);
}
await run('荷花', '_samples/real/p03.jpg', [.26, .24, .62, .56], [[.5, .6]]);
await run('卡通头像', '_samples/real/p14.jpg', [.1, .06, .9, .86], [[.5, .62], [.5, .1]]);
await run('海报里的布', '_samples/real/p07.jpg', [.12, .24, .88, .72], [[.5, .55]]);
await run('纽扣电池', '_samples/real/p10.jpg', [.18, .24, .82, .74], [[.5, .42]]);
document.title = 'done';
</script>
