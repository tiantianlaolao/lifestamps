<!doctype html><meta charset="utf-8">
<title>封皮三版比稿</title>
<!-- 用真实的封面 DOM 渲染（?opening=1 强制出封面），只注入各版的材质样式。
     三版共同点（8-26 用户已定）：去掉桌上那个铁盒、去掉塑料感的红杠松紧带、标签贴保留、贴纸保留。 -->
<style>
 body{margin:0;background:#CFC9BC;display:flex;gap:12px;padding:12px;font:12px sans-serif}
 .col{display:flex;flex-direction:column;align-items:center;gap:6px}
 .lb{color:#3F3530;font-weight:700;letter-spacing:.08em}
 iframe{width:390px;height:820px;border:none;display:block;background:#F6F2EA}
</style>
<div class="col"><span class="lb">甲 · 布面藕粉（细织带）</span><iframe id="a"></iframe></div>
<div class="col"><span class="lb">乙 · 布面奶油（无织带）</span><iframe id="b"></iframe></div>
<div class="col"><span class="lb">丙 · 牛皮纸（包角）</span><iframe id="c"></iframe></div>
<script>
// 三版共同：铁盒和红杠都不要了
const COMMON = `
  .op-desk-tin{display:none!important}
  .op-band{display:none!important}
  .op-cover{background-image:none}
`;

const V = {
  a: `${COMMON}
    /* 布面：纯色 + 极细的织纹，不做渐变高光 */
    .op-cover{
      background:
        repeating-linear-gradient(0deg,  rgba(255,255,255,.05) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.035) 0 1px, transparent 1px 3px),
        #CFA3A2;
      border-color:#B4817F;
    }
    .op-spine{background:#B4817F; border-right-color:rgba(255,255,255,.22)}
    /* 织带：细、哑光、跟布同族，不是塑料红 */
    .op-cover::after{
      content:""; position:absolute; top:-2px; bottom:-2px; left:81%; width:6px;
      background:#9C6E6C; opacity:.85;
    }
    .op-cover .op-t{color:#7A4E4C}
    .op-mon{color:#9C7270}`,

  b: `${COMMON}
    .op-cover{
      background:
        repeating-linear-gradient(0deg,  rgba(255,255,255,.05) 0 1px, transparent 1px 3px),
        repeating-linear-gradient(90deg, rgba(0,0,0,.03) 0 1px, transparent 1px 3px),
        #E2D3B8;
      border-color:#C3AE8B;
    }
    .op-spine{background:#C3AE8B; border-right-color:rgba(255,255,255,.3)}
    .op-cover .op-t{color:#7A6647}
    .op-mon{color:#96805F}`,

  c: `${COMMON}
    /* 牛皮纸：无织纹，纸的颗粒感靠极淡的噪点，四角包角 */
    .op-cover{background:#C8A87E; border-color:#A8875E}
    .op-spine{background:#A8875E; border-right-color:rgba(255,255,255,.2)}
    .op-cover .op-t{color:#5E4526}
    .op-mon{color:#7E6440}
    .op-cover::before{
      content:""; position:absolute; right:0; bottom:0; width:34px; height:34px;
      background:linear-gradient(315deg,#9C7B52 46%,transparent 47%);
      border-bottom-right-radius:6px;
    }
    .op-cover::after{
      content:""; position:absolute; right:0; top:0; width:34px; height:34px;
      background:linear-gradient(225deg,#9C7B52 46%,transparent 47%);
      border-top-right-radius:6px;
    }`,
};

for (const [id, css] of Object.entries(V)) {
  const f = document.getElementById(id);
  f.src = '../index.html?demo=1&skipob=1&band=day&opening=1';
  f.onload = () => {
    const st = f.contentDocument.createElement('style');
    st.textContent = css;
    f.contentDocument.head.appendChild(st);
  };
}
</script>
