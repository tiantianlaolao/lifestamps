<!doctype html><meta charset="utf-8"><style>body{font:13px system-ui;display:flex;gap:30px;padding:20px;background:#FBF8F1}
figure{margin:0;text-align:center}figcaption{margin-top:6px;color:#666}</style>
<div id="w" style="display:flex;gap:30px"></div>
<script type="module">
import { stampById } from '../js/data.js';
import { defsMarkup, stampSVG } from '../js/stamp.js';
document.body.insertAdjacentHTML('afterbegin',`<svg width="0" height="0" style="position:absolute">${defsMarkup()}</svg>`);
const s = stampById['coffee'];
document.getElementById('w').innerHTML = [['r','橡皮'],['w','木质'],['p','光敏']]
  .map(([m,n],i)=>`<figure>${stampSVG(s,{size:44,ink:'mo',mat:m,seed:5})}<figcaption>${n}</figcaption></figure>`).join('');
document.body.style.display='flex';
</script>
