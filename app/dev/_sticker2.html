<!doctype html><meta charset="utf-8">
<title>贴纸两版比稿</title>
<!-- 现在的贴纸是「白底圆角方块」——跟托盘里刚拆掉的图标外壳是同一个形。
     甲 = 模切白边（白边沿章自己的笔画走，没有方框）
     乙 = 手裁纸片（不规则多边形，像剪刀随手剪下来的）
     左边保留现状做对照。 -->
<style>
 body{margin:0;background:#CFC9BC;display:flex;gap:12px;padding:12px;font:12px sans-serif}
 .col{display:flex;flex-direction:column;align-items:center;gap:6px}
 .lb{color:#3F3530;font-weight:700;letter-spacing:.08em}
 iframe{width:390px;height:700px;border:none;display:block;background:#F6F2EA}
</style>
<div class="col"><span class="lb">现状 · 白底圆角方块</span><iframe id="now"></iframe></div>
<div class="col"><span class="lb">甲 · 模切白边</span><iframe id="a"></iframe></div>
<div class="col"><span class="lb">乙 · 手裁纸片</span><iframe id="b"></iframe></div>
<div class="col"><span class="lb">丙 · 两种混着（真收藏就是这样）</span><iframe id="c"></iframe></div>
<script>
const WHITE = '#FDFBF6';
// 甲：沿 alpha 描一圈白边。八个方向各来一次，边够厚时相邻笔画的白边会连成一片剪影。
const DIE = (r => [
  `${r}px 0`, `-${r}px 0`, `0 ${r}px`, `0 -${r}px`,
  `${r * .7}px ${r * .7}px`, `-${r * .7}px -${r * .7}px`,
  `${r * .7}px -${r * .7}px`, `-${r * .7}px ${r * .7}px`,
].map(o => `drop-shadow(${o} 0 ${WHITE})`).join(' '))(2.4);

const V = {
  a: `
    .op-sticker,.loose-sticker{background:none!important; box-shadow:none!important; padding:0!important; border-radius:0!important}
    .op-sticker svg,.loose-sticker svg{
      filter:${DIE} drop-shadow(0 1.5px 1.5px rgba(63,53,48,.32));
    }
    .op-sticker.new::after{right:-4px; top:-4px}`,

  b: `
    .op-sticker,.loose-sticker{
      background:${WHITE}!important; border-radius:0!important; padding:6px!important;
      box-shadow:0 1.5px 2px rgba(63,53,48,.2)!important;
      /* 手裁：四条边各带一点点歪，角也不齐 */
      clip-path:polygon(3% 6%, 46% 1%, 92% 5%, 99% 44%, 95% 93%, 52% 99%, 7% 95%, 1% 48%);
    }
    /* 相邻的几张裁得不一样，别看出来是同一个模子 */
    .op-sticker:nth-child(3n) ,.loose-sticker:nth-child(3n){
      clip-path:polygon(6% 2%, 55% 6%, 97% 3%, 94% 50%, 98% 96%, 44% 92%, 4% 97%, 7% 52%);
    }
    .op-sticker:nth-child(3n+1),.loose-sticker:nth-child(3n+1){
      clip-path:polygon(2% 9%, 50% 2%, 96% 8%, 92% 46%, 99% 90%, 48% 97%, 8% 91%, 5% 45%);
    }`,
};

// 丙：两种混着——真的贴纸收藏本来就是模切和方片混在一起的。
//     按位置定死谁是哪种（偶数格模切、奇数格手裁），不随机，刷新不变。
V.c = `
  .op-sticker,.loose-sticker{
    background:${WHITE}!important; border-radius:0!important; padding:6px!important;
    box-shadow:0 1.5px 2px rgba(63,53,48,.2)!important;
    clip-path:polygon(3% 6%, 46% 1%, 92% 5%, 99% 44%, 95% 93%, 52% 99%, 7% 95%, 1% 48%);
  }
  .op-sticker:nth-child(3n),.loose-sticker:nth-child(3n){
    clip-path:polygon(6% 2%, 55% 6%, 97% 3%, 94% 50%, 98% 96%, 44% 92%, 4% 97%, 7% 52%);
  }
  /* 隔一个换成模切：没有纸片、白边贴着笔画走 */
  .op-sticker:nth-child(2n),.loose-sticker:nth-child(2n){
    background:none!important; box-shadow:none!important; padding:0!important; clip-path:none!important;
  }
  .op-sticker:nth-child(2n) svg,.loose-sticker:nth-child(2n) svg{
    filter:${DIE} drop-shadow(0 1.5px 1.5px rgba(63,53,48,.32));
  }`;

document.getElementById('now').src = '../index.html?demo=1&skipob=1&band=day&opening=1';
for (const [id, css] of Object.entries(V)) {
  const f = document.getElementById(id);
  f.src = '../index.html?demo=1&skipob=1&band=day&opening=1';
  f.onload = () => {
    const st = f.contentDocument.createElement('style');
    st.textContent = css;
    f.contentDocument.head.appendChild(st);
  };
}
</script>
