  <h2>外卖章：换成纸袋样式</h2>
  <div class="sub">从左到右：托盘 30px / 纸上真实 56px / 本子月视图 42px / 分享卡 120px / 放大 200px。
    ⚠️ 袋身上的「外卖」两个字必须画成**笔画**不能用 &lt;text&gt; —— 分享卡是把 SVG 塞进 &lt;img&gt;
    光栅化的隔离文档，读不到自托管字体，字会掉成系统字体。所以问题是：这两个字在 56px 上还读得出来吗。</div>
  <div id="out"></div>
</div>
