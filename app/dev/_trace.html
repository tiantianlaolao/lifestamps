<!doctype html><meta charset="utf-8"><title>图片 → 章 · demo</title>
<style>
 body{margin:0;background:#DDD8CC;font:13px/1.7 system-ui;color:#252421;padding:22px}
 .wrap{max-width:1100px;margin:0 auto}
 h2{font-size:14px;letter-spacing:.14em;margin:0 0 14px;color:#5A544A}
 .box{background:#F6F2EA;border-radius:12px;padding:16px 18px;margin-bottom:14px}
 .ttl{font-size:12px;letter-spacing:.12em;color:#8C8880;margin-bottom:10px}
 .row{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
 .cell{text-align:center}
 .cap{font-size:10.5px;color:#8C8880;margin-top:4px}
 .paper{background:#FBF7EE;border-radius:8px;padding:14px 16px;display:inline-block}
 canvas.dbg{width:200px;height:auto;background:#fff;border-radius:6px}
 label{display:inline-flex;align-items:center;gap:6px;margin-right:16px}
 input[type=range]{width:140px}
 textarea{width:100%;height:70px;font:11px/1.4 ui-monospace,monospace;border:1px solid #D9D2C4;border-radius:6px;background:#FBF7EE}
 .drop{border:2px dashed #B9B2A4;border-radius:10px;padding:18px;text-align:center;color:#8C8880}
 .drop.over{background:#EFE9DC}
 button{font:12px system-ui;padding:5px 12px;border-radius:6px;border:1px solid #B9B2A4;background:#FBF7EE;cursor:pointer}
</style>
<div class="wrap">
<h2>图片 → 章 · demo（全程本机，不上传）</h2>
<div class="box">
  <div class="drop" id="drop">拖一张图进来 / 点这里选图 / 直接 Ctrl+V 粘贴<input type="file" id="file" accept="image/*" hidden></div>
  <div style="margin-top:10px">
    <label><input type="checkbox" id="flatten" checked>去纸底（照片开）</label>
    <label><input type="checkbox" id="invert">反色（亮图案深底）</label>
    <label>阈值 <input type="range" id="thr" min="0" max="255" value="0"><span id="thrv">自动</span><input type="checkbox" id="thrauto" checked title="自动(Otsu)"></label>
    <label>去噪 <input type="range" id="minArea" min="0" max="200" value="12"><span id="minAreav">12</span></label>
    <label>简化 <input type="range" id="eps" min="0.3" max="4" step="0.1" value="1.2"><span id="epsv">1.2</span></label>
    <label><input type="checkbox" id="dropFrame" checked>去掉外框</label>
    <label>留边 <input type="range" id="pad" min="0" max="20" value="8"><span id="padv">8</span></label>
  </div>
</div>
<div id="out"></div>
</div>
<script type="module">
import { INKS, stampById } from '../js/data.js';
import { defsMarkup, stampSVG } from '../js/stamp.js';
import { imageToStamp } from '../js/trace.js';
document.body.insertAdjacentHTML('afterbegin', `<svg width="0" height="0" style="position:absolute">${defsMarkup()}</svg>`);

const $ = (id) => document.getElementById(id);
let img = null;
const q = new URLSearchParams(location.search);

function opts() {
  return {
    flatten: $('flatten').checked, invert: $('invert').checked,
    thr: $('thrauto').checked ? undefined : +$('thr').value,
    minArea: +$('minArea').value, eps: +$('eps').value,
    dropFrame: $('dropFrame').checked, pad: +$('pad').value,
  };
}
function toCanvas(arr, w, h, thr) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; c.className = 'dbg';
  const id = c.getContext('2d').createImageData(w, h);
  for (let i = 0; i < w * h; i++) {
    const v = thr === undefined ? 255 - arr[i] : (arr[i] ? 0 : 255);
    id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255;
  }
  c.getContext('2d').putImageData(id, 0, 0);
  return c;
}
function run() {
  if (!img) return;
  const t0 = performance.now();
  const r = imageToStamp(img, opts());
  const ms = (performance.now() - t0).toFixed(0);
  $('thrv').textContent = $('thrauto').checked ? `自动 ${r.thr}` : r.thr;
  if ($('thrauto').checked) $('thr').value = r.thr;
  const def = { id: 'custom_demo', name: '自定义', cat: 'meet', ink: 'song', d: r.d };
  let h = `<div class="box"><div class="ttl">中间结果 · ${r.w}×${r.h} · 阈值 ${r.thr} · ${r.loops} 个环 · ${(r.chars / 1024).toFixed(1)} KB · ${ms} ms</div><div class="row" id="dbg"></div></div>`;
  h += `<div class="box"><div class="ttl">走 App 真实渲染（含拓印纹理）· 托盘 30 / 纸上 56 / 分享卡 120 / 大图 240</div><div class="row">`;
  for (const [size, cap] of [[30, '托盘 30'], [56, '纸上 56'], [120, '分享卡 120'], [240, '大图 240']])
    h += `<div class="cell"><span class="paper">${stampSVG(def, { size })}</span><div class="cap">${cap}</div></div>`;
  for (const ink of ['zhu', 'mo', 'wu', 'matcha']) {
    if (!INKS[ink]) continue;
    h += `<div class="cell"><span class="paper">${stampSVG(def, { size: 80, ink })}</span><div class="cap">${INKS[ink].name}</div></div>`;
  }
  h += `</div></div>`;
  h += `<div class="box" style="background:#EFE9DC"><div class="ttl">参照 · 库里现有的章（同尺寸）</div><div class="row">`;
  for (const id of ['milktea', 'sparkle']) for (const size of [30, 56, 120])
    h += `<div class="cell"><span class="paper">${stampSVG(stampById[id], { size })}</span><div class="cap">${stampById[id].name} ${size}</div></div>`;
  h += `</div></div>`;
  h += `<div class="box"><div class="ttl">内容包条目（复制进 catalog.json 的 stamps）</div><textarea id="json" readonly></textarea></div>`;
  $('out').innerHTML = h;
  const dbg = $('dbg');
  const wrap = (c, cap) => { const d = document.createElement('div'); d.className = 'cell'; d.appendChild(c); d.insertAdjacentHTML('beforeend', `<div class="cap">${cap}</div>`); return d; };
  dbg.appendChild(wrap(toCanvas(r.ink, r.w, r.h), '去纸底后'));
  dbg.appendChild(wrap(toCanvas(r.bin, r.w, r.h, r.thr), '二值 + 去噪'));
  $('json').value = JSON.stringify({ id: 'custom', name: '自定义', cat: 'meet', ink: 'song', d: r.d });
  window.__trace = r;
}
function load(src) {
  const im = new Image();
  im.onload = () => { img = im; run(); };
  im.src = src;
}
function loadFile(f) { if (f && f.type.startsWith('image/')) load(URL.createObjectURL(f)); }

$('drop').onclick = () => $('file').click();
$('file').onchange = (e) => loadFile(e.target.files[0]);
$('drop').ondragover = (e) => { e.preventDefault(); $('drop').classList.add('over'); };
$('drop').ondragleave = () => $('drop').classList.remove('over');
$('drop').ondrop = (e) => { e.preventDefault(); $('drop').classList.remove('over'); loadFile(e.dataTransfer.files[0]); };
document.onpaste = (e) => { for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) loadFile(it.getAsFile()); };
for (const id of ['flatten', 'invert', 'thrauto', 'dropFrame']) $(id).onchange = run;
for (const id of ['thr', 'minArea', 'eps', 'pad']) {
  $(id).oninput = () => { $(id + 'v').textContent = $(id).value; if (id === 'thr') $('thrauto').checked = false; run(); };
}
// dev：?src=_samples/xxx.jpg 直接开；?thr= ?eps= ?flatten=0 预设参数
if (q.get('thr')) { $('thrauto').checked = false; $('thr').value = q.get('thr'); }
if (q.get('eps')) $('eps').value = q.get('eps');
if (q.get('flatten') === '0') $('flatten').checked = false;
if (q.get('invert') === '1') $('invert').checked = true;
if (q.get('src')) load(q.get('src'));
</script>
