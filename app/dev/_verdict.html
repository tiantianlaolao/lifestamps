<!doctype html><meta charset="utf-8"><title>判词方案</title>
<link rel="stylesheet" href="../css/app.css">
<style>
 body{margin:0;background:#DDD8CC;font:13px/1.7 "Xiaolai",system-ui;color:#252421;padding:22px}
 .wrap{max-width:1060px;margin:0 auto}
 h2{font-family:"LXGW WenKai",serif;font-size:16px;letter-spacing:.12em;margin:0 0 6px;color:#5A544A}
 .sub{color:#6B655C;font-size:12px;margin-bottom:16px;max-width:820px}
 .day{background:#FBF8F1;border-radius:10px;padding:14px 18px 12px;margin-bottom:11px;
      background-image:radial-gradient(circle at 3px 3px,#D3CDBE 2.2px,transparent 2.6px);
      background-size:26px 26px;display:flex;align-items:center;gap:20px}
 .who{font-size:11px;color:#8C8880;width:150px;flex:none;line-height:1.5}
 .stamps{display:flex;gap:8px;align-items:center;flex:none;width:300px;flex-wrap:wrap}
 .verd{font-family:"LXGW WenKai",serif;font-size:19px;color:#252421;letter-spacing:.04em}
 .key{font-size:10px;color:#B3ACA0;margin-top:3px}
 .miss{background:#F8E9E7}
</style>
<div class="wrap">
  <h2>判词方案：12 个真实的一天，各自会拿到哪句</h2>
  <div class="sub">左边是那天盖了什么（带钟点），右边是系统给出的判词。
    规则是从具体到笼统、第一条命中就用 —— 所以越靠前的越像"原来如此"，最后几条是永远兜得住的底。
    ⚠️ 判词写什么、什么语气，是要你拍板的部分；规则和兜底我来保证。</div>
  <div id="out"></div>
</div>
<script type="module">
import { stampById, COPY } from '../js/data.js';
import { defsMarkup, stampSVG } from '../js/stamp.js';
import { verdictOf, VERDICTS } from '../js/verdict.js';
document.body.insertAdjacentHTML('afterbegin',
  `<svg width="0" height="0" style="position:absolute">${defsMarkup()}</svg>`);

let seq = 0;
const at = (id, h) => ({ id: 'r' + (seq++), stampId: id, ink: 'zhu', ts: new Date(2026, 7, 28, h, 0).getTime() });

// 12 个场景，尽量像真人过的一天，不是为了凑条件编的
const DAYS = [
  ['加班到深夜的打工人', [at('work', 10), at('coffee', 14), at('work', 20), at('stayup', 23)]],
  ['周末彻底摆烂',       [at('lie', 11), at('daze', 14), at('phone', 16), at('lie', 21)]],
  ['点了外卖窝在床上',   [at('takeout', 12), at('lie', 13), at('series', 20)]],
  ['被甜品拯救的下午',   [at('milktea', 15), at('dessert', 16), at('happy', 17)]],
  ['熬夜之后睡到中午',   [at('sleepin', 12), at('coffee', 14), at('stayup', 25 % 24)]],
  ['难过的一天',         [at('emo', 15), at('cry', 21), at('tired', 22)]],
  ['出门遛了一圈',       [at('goout', 10), at('cat', 11), at('flower', 15), at('sunset', 18)]],
  ['安静看了一天书',     [at('read', 10), at('read', 15), at('study', 20)]],
  ['很注意喝水的一天',   [at('water', 9), at('water', 13), at('water', 17), at('work', 11)]],
  ['很满的一天',         [at('goout', 8), at('coffee', 9), at('work', 10), at('takeout', 12),
                          at('water', 14), at('series', 20), at('happy', 21), at('stayup', 23)]],
  ['只盖了一枚',         [at('milktea', 15)]],
  ['整天都是晚上开始的', [at('series', 20), at('nightsnack', 22), at('stayup', 23)]],
];

let h = '';
for (const [label, recs] of DAYS) {
  const key = verdictOf(recs);
  const text = COPY[key];
  const missing = !text || text === key;
  h += `<div class="day${missing ? ' miss' : ''}">
    <div class="who">${label}<div class="key">${recs.length} 枚</div></div>
    <div class="stamps">${recs.map(r =>
      `<span title="${stampById[r.stampId].name} ${new Date(r.ts).getHours()}点">
        ${stampSVG(stampById[r.stampId], { size: 34, ink: 'zhu', mat: 'r', seed: 3 })}</span>`).join('')}</div>
    <div><div class="verd">${text}</div><div class="key">${key}</div></div>
  </div>`;
}

// 兜底检查：23 条判词有没有写不出词条的
const noText = VERDICTS.filter(v => !COPY[v.key] || COPY[v.key] === v.key).map(v => v.key);
h += `<div class="sub" style="margin-top:14px">
  共 ${VERDICTS.length} 条判词规则。${noText.length ? '🔴 缺文案: ' + noText.join(',') : '每条都有文案。'}
</div>`;
document.getElementById('out').innerHTML = h;
</script>
