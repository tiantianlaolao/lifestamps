<!doctype html><meta charset="utf-8"><title>判词×补一句 不重叠</title>
<!-- 8-30 用户截图抓到：写了「给这天补一句」之后，判词还照画在纸的下缘，两行叠在一起。
     规则修成跟日卡一致：用户自己写的话优先，判词只在没写话时出现。这页守住它别回潮。
     顺手守同批的另一条改动：月历点过去的日子 = 直接进翻页视图（补盖少一步）。
     做法照 _drawerclick：iframe 真页，先摆状态再点。 -->
<style>body{font:13px/1.7 monospace;background:#111;color:#ddd;padding:16px}
.p{color:#7c6}.f{color:#f66;font-weight:700} iframe{border:1px solid #555;margin-top:10px}</style>
<div id="out"></div><iframe id="f" width="390" height="700"></iframe>
<script>
const out = document.getElementById('out'), f = document.getElementById('f');
let pass = 0, fail = 0;
const ok = (c, m) => { const d = document.createElement('div');
  d.className = c ? 'p' : 'f'; d.textContent = (c ? 'PASS  ' : 'FAIL  ') + m;
  out.appendChild(d); c ? pass++ : fail++; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

(async () => {
 try {
  // 摆状态（要在 App 起来之前写 localStorage）：8-20 有 4 枚章（够出判词），先不写话
  localStorage.clear();
  const dk = '2026-08-20', base = new Date(dk + 'T10:00:00').getTime();
  const recs = ['milktea', 'lie', 'takeout', 'happy'].map((sid, i) =>
    ({ id: 'vn' + i, stampId: sid, ink: 'zhu', ts: base + i * 3600e3 }));
  localStorage.setItem('lifestamps_records', JSON.stringify(recs));

  async function openDay(note) {
    if (note !== undefined) {
      const meta = note ? { [dk]: { note } } : {};
      localStorage.setItem('lifestamps_dayMeta', JSON.stringify(meta));
    }
    f.src = '/index.html?demo=0&skipob=1&book=open&tab=memories&day=' + dk;
    await new Promise(r => { f.onload = r; }); await sleep(1800);
    const d = f.contentDocument;
    // 月历里点 8-20 的格子 → 应直接进翻页视图
    const cell = d.querySelector(`.pg-cell[data-dk="${dk}"]`);
    if (cell) { cell.click(); await sleep(900); }
    return d.getElementById('page-memories');
  }

  let pm = await openDay('');
  ok(!!pm.querySelector('.pg-cell') || !!pm.querySelector('.bookpage'), '本子页起来了');
  ok(!!pm.querySelector('.bookpage'), '⭐ 点月历格子直接进了那一天（翻页视图）');
  ok(!!pm.querySelector('.verdict-line'), '没写话时：判词在纸上');
  ok(!pm.querySelector('.day-note'), '没写话时：没有 day-note');

  pm = await openDay('今天过得很好');
  ok(!!pm.querySelector('.day-note'), '写了话：day-note 在纸上');
  ok(!pm.querySelector('.verdict-line'), '⭐ 写了话：判词让位，不再重叠');
 } catch (e) {
  ok(false, 'CRASH: ' + (e && e.stack || e));
 }
 const d = document.createElement('div');
 d.textContent = `—— 通过 ${pass} / 失败 ${fail}`;
 out.appendChild(d);
})();
</script>
