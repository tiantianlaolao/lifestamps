<!doctype html><meta charset="utf-8"><title>那行字一个槽位 + 本子里就地摊开</title>
<!-- 8-30 重构的两条主线在这页守着：
     ① 纸下缘那行字只有一个槽位：用户的话(mine) > 判词 > 「写一句…」占位，永不共存两条
     ② 本子月历点某天 = 日页(今日那份 DOM)就地摊开：tab 高亮留在本子、顶栏有「‹ 本子」
     做法照 _drawerclick：iframe 真页，先摆状态再点。 -->
<style>body{font:13px/1.7 monospace;background:#111;color:#ddd;padding:16px}
.p{color:#7c6}.f{color:#f66;font-weight:700} iframe{border:1px solid #555;margin-top:10px}</style>
<div id="out"></div><iframe id="f" width="390" height="700"></iframe>
<script>
const out = document.getElementById('out'), f = document.getElementById('f');
let pass = 0, fail = 0;
const ok = (c, m) => { const d = document.createElement('div');
  d.className = c ? 'p' : 'f'; d.textContent = (c ? 'PASS  ' : 'FAIL  ') + m;
  out.appendChild(d); c ? pass++ : fail++; };
const sleep = ms => new Promise(r => setTimeout(r, ms));

(async () => {
 try {
  // ⚠️ 日子必须动态取"今天"：本子月历默认打开**当前月**，写死某个月（原来是 2026-08-20）
  //    一跨月格子就不在屏上，整页从 9-01 起全红 —— 跟被测代码无关，是测试自己烂了。
  //    用今天而不是"本月 1 号"是因为判词对今天要 ≥3 枚才出（这里种了 4 枚，够）。
  const _n = new Date(), _p = n => String(n).padStart(2, '0');
  const dk = `${_n.getFullYear()}-${_p(_n.getMonth() + 1)}-${_p(_n.getDate())}`;
  const base = new Date(dk + 'T10:00:00').getTime();
  const recs = ['milktea', 'lie', 'takeout', 'happy'].map((sid, i) =>
    ({ id: 'vn' + i, stampId: sid, ink: 'zhu', ts: base + i * 3600e3 }));

  async function openDay(note) {
    localStorage.clear();
    localStorage.setItem('lifestamps_records', JSON.stringify(recs));
    if (note) localStorage.setItem('lifestamps_dayMeta', JSON.stringify({ [dk]: { note } }));
    f.src = '/index.html?skipob=1&book=open&tab=memories';
    await new Promise(r => { f.onload = r; }); await sleep(1600);
    const d = f.contentDocument;
    // ⚠️ 月签要在点开日页**之前**查：openDayInBook 会清空本子那页的 DOM（防暗处旧 DOM）
    d._hadTabs = !!d.querySelector('.month-tabs .mtab');
    const cell = d.querySelector(`.pg-cell[data-dk="${dk}"]`);
    if (cell) { cell.click(); await sleep(900); }
    return d;
  }

  let d = await openDay('');
  ok(d._hadTabs, '本子页起来了（月份便签在）');
  ok(d.getElementById('page-today').classList.contains('active'),
     '⭐ 点月历格子 = 日页（今日那份 DOM）就地摊开');
  ok(d.querySelector('#tabbar button.active')?.dataset.tab === 'memories',
     '⭐ tab 高亮留在「本子」——人没被拽出书');
  ok(!!d.getElementById('bk-back'), '顶栏有「‹ 本子」返回');
  ok(!!d.querySelector('#deck-strip, .deck'), '托盘就在纸下面（想补就补）');
  const line1 = d.querySelectorAll('#today-canvas .day-line');
  ok(line1.length === 1 && !line1[0].classList.contains('mine') && !line1[0].classList.contains('ghost'),
     '没写话时：只有一行 = 判词（系统代笔态）');

  // 「‹ 本子」回月历
  d.getElementById('bk-back').click(); await sleep(700);
  ok(!!d.querySelector('#page-memories .pg-grid'), '返回后回到月历');

  d = await openDay('今天过得很好');
  const line2 = d.querySelectorAll('#today-canvas .day-line');
  ok(line2.length === 1 && line2[0].classList.contains('mine')
     && line2[0].textContent.includes('今天过得很好'),
     '⭐ 写了话：只有一行 = 你的话（mine），判词让位，永不重叠');
 } catch (e) {
  ok(false, 'CRASH: ' + (e && e.stack || e));
 }
 const d2 = document.createElement('div');
 d2.textContent = `—— 通过 ${pass} / 失败 ${fail}`;
 out.appendChild(d2);
})();
</script>
