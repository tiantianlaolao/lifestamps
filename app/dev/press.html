<!doctype html><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>2.5D 盖章手感 · 演示</title>
<style>
:root{--paper:#F6F2EA;--ink:#252421;--sub:#8C8880;--accent:#C94B3C;--line:rgba(37,36,33,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#EAE5DA;font-family:"MiSans","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);display:flex;justify-content:center}
#wrap{width:390px;min-height:100vh;background:var(--paper);padding:20px 18px 30px;position:relative}
#wrap::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4'/></filter><rect width='300' height='300' filter='url(%23n)' opacity='0.5'/></svg>");
  opacity:.05;mix-blend-mode:multiply}
h1{font-size:15px;font-weight:600;letter-spacing:1px}
h1 small{font-weight:400;color:var(--sub);font-size:12px;margin-left:8px}
.row{display:flex;align-items:center;gap:8px;margin-top:12px}
.row .lab{font-size:12px;color:var(--sub);flex:none}
.sw{width:26px;height:26px;border-radius:4px;border:1.5px solid transparent;cursor:pointer;flex:none}
.sw.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--paper) inset}
.stp{font-size:12px;padding:3px 10px;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;color:var(--sub)}
.stp.on{color:var(--ink);border-color:var(--ink)}
#stage{position:relative;margin-top:14px;height:520px}
#paperCard{position:absolute;left:0;right:0;top:0;height:330px;background:#FBF8F1;
  border:1px solid var(--line);border-radius:4px;cursor:pointer;overflow:hidden}
#paperCard .dl{position:absolute;left:14px;top:10px;font-size:12px;color:var(--sub);letter-spacing:1px}
#paperCard .hint{position:absolute;left:0;right:0;top:46%;text-align:center;font-size:12px;color:#C9C3B7;pointer-events:none}
.imp{position:absolute;pointer-events:none}
#padWrap{position:absolute;left:6px;bottom:6px;width:140px;text-align:center;cursor:pointer}
#padWrap .dots{margin-top:2px;font-size:0}
#padWrap .dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:0 3px;opacity:.85}
#padWrap .dots i.off{background:none;border:1px solid var(--line)}
#padWrap .pn{font-size:11px;color:var(--sub);margin-top:3px}
#padWrap.empty svg{filter:grayscale(.9);opacity:.55}
#stampEl{position:absolute;left:0;top:0;width:96px;height:132px;pointer-events:none;z-index:10;
  transition:transform .5s cubic-bezier(.3,.9,.35,1)}
#status{margin-top:10px;font-size:12.5px;color:var(--sub);min-height:20px;text-align:center;letter-spacing:.5px}
#newpad{display:none;margin:8px auto 0;font-size:13px;padding:6px 18px;border:1px solid var(--accent);
  color:var(--accent);background:none;border-radius:4px;cursor:pointer;letter-spacing:1px}
#newpad.show{display:block}
</style>
<div id="wrap">
  <h1>2.5D 盖章手感 <small>dev 演示 · 不进正式版</small></h1>
  <div class="row"><span class="lab">印泥</span><span id="inks"></span></div>
  <div class="row"><span class="lab">印章</span><span id="stps"></span></div>
  <div id="stage">
    <div id="paperCard"><span class="dl">8月25日 · 周二</span><span class="hint">点纸面盖章</span></div>
    <div id="padWrap"><div id="padSvg"></div><div class="dots" id="padDots"></div><div class="pn" id="padName"></div></div>
    <div id="stampEl"><div id="stampInner"></div></div>
  </div>
  <div id="status">先点左下角印泥盒蘸一下</div>
  <button id="newpad">换一盒新印泥</button>
</div>
<script type="module">
import { INKS, stampById } from '../js/data.js';
import { defsMarkup, stampSVG, inkPaint } from '../js/stamp.js';

const $ = s => document.querySelector(s);
const AUTO = new URLSearchParams(location.search).get('auto');
const T = AUTO ? 0.01 : 1;                      // 动画时间系数（auto 秒过）

document.body.insertAdjacentHTML('afterbegin',
  `<svg width="0" height="0" style="position:absolute">${defsMarkup()}</svg>`);

// ---------- 状态 ----------
const INK_IDS = ['zhu','song','wu','sunset'];
const STAMP_IDS = ['milktea','coffee','cat'];
const PAD_MAX = 5;                              // 演示：一盒印泥可蘸 5 次
let inkId = 'zhu', stampId = 'milktea';
let charge = 0;                                 // 蘸一次=3 层墨
let pads = Object.fromEntries(INK_IDS.map(k => [k, PAD_MAX]));
let busy = false;

// 盖章浓度：第1下浓、第2下淡、第3下几乎看不见、没墨=只有压痕
const OP = { 3:.95, 2:.5, 1:.16, 0:.05 };
const MSG = { 3:'墨蘸得足足的', 2:'墨还够，再盖会淡一点', 1:'墨有点淡了', 0:'干了——去蘸蘸印泥吧' };

// ---------- 2.5D 印章本体（木柄+橡皮底，章底随蘸墨染色） ----------
function stampBodySVG() {
  const def = stampById[stampId];
  const faceOp = { 3:.9, 2:.55, 1:.25, 0:0 }[charge];
  const paint = inkPaint(inkId);
  return `<svg width="96" height="132" viewBox="0 0 100 138" style="overflow:visible">
    <g filter="url(#ls-w1)">
      <path d="M50,5 Q69,5 67,26 Q66,40 57,46 L43,46 Q34,40 33,26 Q31,5 50,5 Z"
            fill="#D9BC96" stroke="#8C6C55" stroke-width="3.4"/>
      <path d="M42,15 Q40,24 42,33" fill="none" stroke="#B99B74" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="43" y="46" width="14" height="10" rx="2" fill="#C9A87E" stroke="#8C6C55" stroke-width="3"/>
      <rect x="20" y="56" width="60" height="40" rx="4" fill="#EFCDBD" stroke="#B98A76" stroke-width="3.4"/>
      <rect x="68" y="59" width="9" height="34" rx="3" fill="#E0B7A5" opacity=".7"/>
    </g>
    <foreignObject x="30" y="58" width="40" height="36">
      <div xmlns="http://www.w3.org/1999/xhtml" style="opacity:.9">${stampSVG(def,{size:36,gray:true})}</div>
    </foreignObject>
    <g filter="url(#ls-w1)">
      <rect x="22" y="88" width="56" height="8" rx="2.5" fill="${paint}" opacity="${faceOp}"/>
      <rect x="20" y="95" width="60" height="4" rx="2" fill="${paint}" opacity="${Math.min(1,faceOp+.08)}"/>
    </g>
    <ellipse id="shadow" cx="50" cy="104" rx="34" ry="5" fill="#252421" opacity=".08"/>
  </svg>`;
}

// ---------- 印泥盒 ----------
function padSVG() {
  const left = pads[inkId];
  const surfOp = left > 0 ? (.55 + .45 * left / PAD_MAX) : .18;
  return `<svg width="132" height="86" viewBox="0 0 132 86">
    <g filter="url(#ls-w0)">
      <rect x="10" y="46" width="112" height="32" rx="6" fill="#E7E1D5" stroke="#8C8880" stroke-width="3"/>
      <rect x="18" y="52" width="96" height="20" rx="3.5" fill="${inkPaint(inkId)}" opacity="${surfOp}"/>
    </g>
  </svg>`;
}

// ---------- 渲染 ----------
// 色块要用 CSS 背景，渐变得转成 linear-gradient（SVG paint url 在 CSS 里无效）
function cssSwatch(k) {
  const ink = INKS[k];
  if (ink.type === 'solid') return ink.color;
  if (ink.type === 'gradient')
    return `linear-gradient(135deg,${ink.stops.map(([o,c]) => `${c} ${o*100}%`).join(',')})`;
  return ink.bg;
}
function renderInks() {
  $('#inks').innerHTML = INK_IDS.map(k =>
    `<span class="sw ${k===inkId?'on':''}" data-k="${k}" title="${INKS[k].name}"
       style="background:${cssSwatch(k)};display:inline-block;vertical-align:middle;margin-right:8px"></span>`).join('');
}
function renderStps() {
  $('#stps').innerHTML = STAMP_IDS.map(k =>
    `<button class="stp ${k===stampId?'on':''}" data-k="${k}">${stampById[k].name}</button>`).join('');
}
function renderStamp() { $('#stampInner').innerHTML = stampBodySVG(); }
function renderPad() {
  $('#padSvg').innerHTML = padSVG();
  const left = pads[inkId];
  $('#padDots').innerHTML = Array.from({length:PAD_MAX}, (_,i) =>
    `<i class="${i < left ? '' : 'off'}" style="background:${i < left ? '' : 'none'}"></i>`).join('');
  $('#padDots').querySelectorAll('i:not(.off)').forEach(el => el.style.background = '#C94B3C');
  $('#padName').textContent = INKS[inkId].name + (left > 0 ? ` · 还能蘸 ${left} 次` : ' · 见底了');
  $('#padWrap').classList.toggle('empty', left === 0);
  $('#newpad').classList.toggle('show', left === 0);
}
function say(t) { $('#status').textContent = t; }

// ---------- 移动/按压 ----------
const HOME = { x: 260, y: 392 };
function moveTo(x, y, ms = 500) {
  const el = $('#stampEl');
  el.style.transition = `transform ${ms * T}ms cubic-bezier(.3,.9,.35,1)`;
  el.style.transform = `translate(${x}px,${y}px)`;
  return new Promise(r => setTimeout(r, ms * T + 20));
}
function press(deep = false) {
  if (AUTO) return Promise.resolve();           // 无头验收：WAAPI 不发帧，finished 永不回
  const a = $('#stampInner').animate([
    { transform: 'translateY(0) scaleY(1)' },
    { transform: `translateY(${deep?16:13}px) scaleY(.93)`, offset: .45 },
    { transform: `translateY(${deep?16:13}px) scaleY(.93)`, offset: .62 },
    { transform: 'translateY(0) scaleY(1)' },
  ], { duration: 420 * T, easing: 'ease-in-out' });
  return a.finished;
}
const wait = ms => new Promise(r => setTimeout(r, ms * T));

// ---------- 动作 ----------
async function dip() {
  if (busy) return;
  if (pads[inkId] <= 0) { say('这盒印泥见底了，换一盒新的吧'); return; }
  busy = true;
  const pw = $('#padWrap'), st = $('#stage').getBoundingClientRect(), pr = pw.getBoundingClientRect();
  await moveTo(pr.left - st.left + pr.width/2 - 48, pr.top - st.top - 78, 480);
  const done = press(true);
  await wait(200);
  pads[inkId]--; charge = 3;
  renderStamp(); renderPad();
  await done;
  await moveTo(HOME.x, HOME.y, 420);
  say(MSG[3] + '，去纸上盖一个');
  busy = false;
}

async function stampAt(px, py) {
  if (busy) return;
  busy = true;
  $('#paperCard .hint')?.remove();
  const S = 64;
  const x = Math.max(6, Math.min(px - S/2, 284)), y = Math.max(26, Math.min(py - S/2, 260));
  await moveTo(x + S/2 - 48, y + S/2 - 96, 480);
  const op = OP[charge];
  const done = press();
  await wait(190);
  const rot = +(Math.random() * 8 - 4).toFixed(1);
  $('#paperCard').insertAdjacentHTML('beforeend',
    `<span class="imp" style="left:${x}px;top:${y}px">${stampSVG(stampById[stampId],{size:S,ink:inkId,rot,opacity:op})}</span>`);
  if (charge > 0) charge--;
  renderStamp();
  await done;
  await moveTo(HOME.x, HOME.y, 420);
  say(MSG[charge]);
  busy = false;
}

// ---------- 事件 ----------
$('#inks').addEventListener('click', e => {
  const k = e.target.dataset.k; if (!k || busy) return;
  inkId = k; charge = 0;                        // 换色=章上的旧墨作废（演示简化）
  renderInks(); renderPad(); renderStamp();
  say(`换了「${INKS[k].name}」，先蘸一下`);
});
$('#stps').addEventListener('click', e => {
  const k = e.target.dataset.k; if (!k || busy) return;
  stampId = k; renderStps(); renderStamp();
});
$('#padWrap').addEventListener('click', dip);
$('#paperCard').addEventListener('click', e => {
  const r = $('#paperCard').getBoundingClientRect();
  stampAt(e.clientX - r.left, e.clientY - r.top);
});
$('#newpad').addEventListener('click', () => {
  pads[inkId] = PAD_MAX; renderPad();
  say(`新的一盒「${INKS[inkId].name}」，颜色满满的`);
});

// ---------- 初始化 ----------
renderInks(); renderStps(); renderStamp(); renderPad();
$('#stampEl').style.transform = `translate(${HOME.x}px,${HOME.y}px)`;

// auto 演示：蘸一次→连盖三次看衰减→换晚霞蘸一次盖一个
if (AUTO) (async () => {
  await wait(300);
  await dip();
  await stampAt(80, 90); await stampAt(190, 120); await stampAt(300, 95);
  inkId = 'sunset'; charge = 0; renderInks(); renderPad(); renderStamp();
  await dip();
  await stampAt(120, 220);
  say('演示完毕：同一次蘸墨，三下由浓到淡');
})();
</script>
