<!doctype html><meta charset="utf-8">
<title>V1.2 自动断言</title>
<style>body{font-family:Consolas,monospace;font-size:13px;padding:16px;background:#fff}
.p{color:#177245}.f{color:#C00;font-weight:bold}
/* ⚠️ 这个 iframe 不能 display:none——没有布局的文档里 getBoundingClientRect()/scrollHeight 全是 0，
   任何量尺寸的断言都会变成 0 比 0 的假 PASS（8-26 踩到：托盘格子宽度那条）。 */
iframe{width:390px;height:700px;border:1px solid #ccc}</style>
<div id="out">running...</div>
<iframe id="f"></iframe>
<script>
const out = [], O = document.getElementById('out');
const ok = (name, cond, extra='') => out.push(`<div class="${cond?'p':'f'}">${cond?'PASS':'FAIL'} ${name} ${extra}</div>`);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const f = document.getElementById('f');

function LS(k){ try{return JSON.parse(localStorage.getItem('lifestamps_'+k))}catch{return null} }
function clickAt(el, fx=0.5, fy=0.5){
  const r = el.getBoundingClientRect();
  el.dispatchEvent(new MouseEvent('click', {bubbles:true, clientX:r.left+r.width*fx, clientY:r.top+r.height*fy}));
}

(async () => {
  localStorage.clear();
  f.src = '../index.html?skipob=1&sel=milktea&noopen=1';   // 开场层会挡在最上面，测交互时关掉
  await new Promise(r => f.onload = r);
  // ⚠️ 页面里抛的异常必须单独收——盖章的后半程在 setTimeout 里跑，
  //    那里抛错不会让任何断言失败（8-26 就是这么漏掉一个 ReferenceError 的，用户先撞上的）。
  const errs = [];
  f.contentWindow.addEventListener('error', e => errs.push(e.message + ' @' + (e.lineno || '?')));
  f.contentWindow.addEventListener('unhandledrejection', e => errs.push('Promise: ' + (e.reason && e.reason.message)));
  await sleep(250);
  const D = () => f.contentDocument;

  // 1. 初始：印泥盒默认满（pads 空对象 = 满）
  ok('初始 pads 为空(=默认满盒)', !LS('pads') || Object.keys(LS('pads')).length === 0);

  // 2. 蘸朱红 → 扣一格
  D().querySelector('#deck-inks .dk-ink[data-ink="zhu"]').click();
  await sleep(120);
  ok('蘸一次朱红后 pads.zhu=11', LS('pads')?.zhu === 11, 'got '+LS('pads')?.zhu);

  // 3. 连盖三下 → 浓度递减，第4下被挡（落章在按压接触瞬间 ~300ms 后入账）
  clickAt(D().querySelector('#today-canvas'), .3, .3); await sleep(550);
  clickAt(D().querySelector('#today-canvas'), .6, .4); await sleep(550);
  clickAt(D().querySelector('#today-canvas'), .4, .7); await sleep(550);
  let recs = LS('records') || [];
  ok('盖了 3 枚', recs.length === 3, 'got '+recs.length);
  const ops = recs.map(r => r.op);
  ok('三下由浓到淡 '+ops.join(' > '), ops[0] > ops[1] && ops[1] > ops[2]);
  ok('第3下几乎看不见(op<0.2)', ops[2] < 0.2, 'got '+ops[2]);
  clickAt(D().querySelector('#today-canvas'), .7, .6); await sleep(550);
  ok('没墨后第4下被挡', (LS('records')||[]).length === 3);

  // 4. 印泥盒：领今日补给 → 补满 + 记领取日；同日不能再领
  D().querySelector('#tray-supply').click(); await sleep(150);   // 入口从纸外卡片挪进了托盘那行小字
  D().querySelector('[data-refill="zhu"]').click(); await sleep(120);
  ok('补满后 pads.zhu=12', LS('pads')?.zhu === 12, 'got '+LS('pads')?.zhu);
  const today = new Date(), dk = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  ok('supplyDay=今天', LS('supplyDay') === dk, 'got '+LS('supplyDay'));
  D().querySelector('#deck-inks .dk-ink[data-ink="song"]').click(); await sleep(100); // 松绿用掉一格
  const anyEnabled = [...D().querySelectorAll('#supply-list [data-refill]')].some(b => !b.disabled);
  ok('已领过：所有补满按钮禁用', !anyEnabled);

  // 🔴 V1.15 埋过一个会把 App 用死的雷，这几条是它的防线：
  //    applyLook() 把设置写成 <html data-font/data-desk>，而「我的」页用
  //    document.querySelectorAll('[data-font]') 挂监听 —— <html> 自己匹配上了，
  //    每进一次「我的」就往根元素挂一个 click 监听、只增不减，
  //    而监听里是 store.persist() + renderMe()。于是点任何地方都触发 N 次写盘 + N 次整页重渲染。
  {
    const de = D().documentElement;
    ok('根元素不会被当成设置按钮', !de.matches('[data-font],[data-desk]'),
       `data-font=${de.getAttribute('data-font')} data-desk=${de.getAttribute('data-desk')}`);
    // 量用户可见的事实：进过几次「我的」之后，在别处点一下不许写设置、不许重渲染「我的」
    const W = f.contentWindow;
    for (let i = 0; i < 3; i++) {
      D().querySelector('#tabbar [data-tab="me"]').click(); await sleep(160);
      D().querySelector('#tabbar [data-tab="today"]').click(); await sleep(160);
    }
    let writes = 0;
    const orig = W.localStorage.setItem.bind(W.localStorage);
    W.localStorage.setItem = function (k, v) { if (k === 'lifestamps_settings') writes++; return orig(k, v); };
    // ⚠️ 别点纸——那会真盖一枚章，而 store.persist() 是把所有 key 一起写的，
    //    settings 也会被带着写一次，判据就废了（第一版就是这么写的，红了）。
    //    点 body：正常情况下什么都不该发生；有那个 bug 的话，click 冒泡到 <html>
    //    会把挂在根上的 N 个监听全触发一遍。
    D().body.dispatchEvent(new W.MouseEvent('click', { bubbles: true }));
    await sleep(300);
    W.localStorage.setItem = orig;
    ok('在别处点一下不会触发设置写盘（监听没挂到根元素上）', writes === 0, `写了 ${writes} 次`);
  }

  // 4b. 托盘两态
  const bd0 = D().querySelector('#backdrop'); if (bd0) bd0.click(); await sleep(150);
  ok('默认收起态', !D().querySelector('#deck').classList.contains('open'));
  {
    const m = D().querySelector('main');
    ok('收起态今日页根本不需要滚', m.scrollHeight <= m.clientHeight + 1,
       `scrollH ${m.scrollHeight} / clientH ${m.clientHeight}`);
    const bk = f.contentWindow.getComputedStyle(D().querySelector('#page-today .book'));
    ok('收起态纸独占手势（翻页不会被滚动抢走）', bk.touchAction === 'none', 'touch-action = ' + bk.touchAction);
  }
  ok('收起态有「更多」', !!D().querySelector('#deck-more'));
  // 🔴 8-27：整排印泥常驻。判据不能只看"元素在不在"——.deck 是 overflow:hidden + max-height，
  //    被切掉的元素照样有 DOM 和尺寸。量的是"它整个在托盘的可视区里"。
  {
    const ik = D().querySelector('#deck-inks').getBoundingClientRect();
    const dk = D().querySelector('#deck').getBoundingClientRect();
    ok('收起态整排印泥常驻且没被切', ik.height > 20 && ik.bottom <= dk.bottom + 1 && ik.top >= dk.top - 1,
       `印泥 ${ik.top.toFixed(0)}~${ik.bottom.toFixed(0)} / 托盘 ${dk.top.toFixed(0)}~${dk.bottom.toFixed(0)}`);
    const ft = D().querySelector('.tray-foot').getBoundingClientRect();
    ok('收起态材质/状态那行也没被切', ft.bottom <= dk.bottom + 1, `脚 ${ft.bottom.toFixed(0)} vs 托盘底 ${dk.bottom.toFixed(0)}`);
  }
  // 🔴 8-27 托盘改两行之后，用户唯一的硬约束："不要影响拖动"。
  //    这里量的是用户可见的事实：收起态从托盘竖着拖一枚章上纸，纸上真的多一枚印。
  //    ⚠️ 不能用 .click()——选中和拖拽都活在 pointer 事件里，click 测不到（8-26 假 PASS 踩过）。
  {
    const before = (LS('records') || []).length;
    const c0 = D().querySelector('#deck-strip .dk-stamp');
    const rc0 = c0.getBoundingClientRect();
    const cv0 = D().querySelector('#today-canvas').getBoundingClientRect();
    const pd = (t, x, y, el) => (el || c0).dispatchEvent(new f.contentWindow.PointerEvent(t,
      { bubbles: true, cancelable: true, pointerId: 3, pointerType: 'touch', clientX: x, clientY: y }));
    pd('pointerdown', rc0.left + 20, rc0.top + 20);
    pd('pointermove', rc0.left + 22, rc0.top - 40); await sleep(30);
    const lifted = f.contentWindow.getComputedStyle(D().querySelector('#drag-ghost')).display !== 'none';
    ok('收起态竖着拖 = 拎起一枚章', lifted);
    const tx = cv0.left + cv0.width * 0.5, ty = cv0.top + cv0.height * 0.6;
    pd('pointermove', tx, ty); await sleep(30);
    // ⚠️ 落章不是同步的：章体压下去 300ms 才写记录、760ms 才整页同步（踩过：等 260ms 读到的还是旧数）
    pd('pointerup', tx, ty); await sleep(1000);
    ok('拖到纸上真的落了一枚', (LS('records') || []).length === before + 1,
       `${before} → ${(LS('records') || []).length}`);
    // 撤回去，别让这一枚影响后面按张数算的断言（顺带验了撤销）
    D().querySelector('#undo-btn')?.click(); await sleep(200);
    ok('撤销把它收回去了', (LS('records') || []).length === before,
       `${(LS('records') || []).length} vs ${before}`);
  }
  // 横向拖 = 滚条带，不该拎起章
  {
    const c1 = D().querySelector('#deck-strip .dk-stamp');
    const st1 = D().querySelector('#deck-strip');
    const l0 = st1.scrollLeft;
    const r1 = c1.getBoundingClientRect();
    const pd = (t, x, y) => c1.dispatchEvent(new f.contentWindow.PointerEvent(t,
      { bubbles: true, cancelable: true, pointerId: 4, pointerType: 'touch', clientX: x, clientY: y }));
    pd('pointerdown', r1.left + 20, r1.top + 20);
    pd('pointermove', r1.left - 60, r1.top + 22); await sleep(40);
    const g1 = f.contentWindow.getComputedStyle(D().querySelector('#drag-ghost')).display !== 'none';
    ok('收起态横着拖 = 滚条带、不拎章', !g1 && st1.scrollLeft > l0 + 20,
       `ghost=${g1} scrollLeft ${l0} → ${st1.scrollLeft}`);
    pd('pointerup', r1.left - 60, r1.top + 22); await sleep(60);
  }
  D().querySelector('#deck-more').click(); await sleep(320);
  ok('点更多展开', D().querySelector('#deck').classList.contains('open'));
  // 🔴 8-27 用户实测打回："翻页和屏幕滚动混在一起"。纸的手势必须跟托盘状态联动：
  //    收起（页面不滚）→ 纸独占 touch-action:none；展开（页面会滚）→ 把纵向还回去。
  {
    const bk = f.contentWindow.getComputedStyle(D().querySelector('#page-today .book'));
    ok('托盘展开时纸把纵向还给页面', bk.touchAction === 'pan-y', 'touch-action = ' + bk.touchAction);
  }
  // 新手势的提示必须"展开就看得见"，而且不能被托盘裁掉（.deck 是 overflow:hidden）
  {
    const tip = D().querySelector('.deck-tip'), dkr = D().querySelector('#deck').getBoundingClientRect();
    const tr = tip && tip.getBoundingClientRect();
    ok('展开态右上角有「按住能拎起来」的提示且没被裁', !!tip && tr.width > 40 &&
       tr.right <= dkr.right + 1 && tr.left >= dkr.left - 1 && tr.top >= dkr.top - 1,
       tip ? `提示 ${tr.left|0}~${tr.right|0} / 托盘 ${dkr.left|0}~${dkr.right|0}` : '没找到 .deck-tip');
  }
  ok('展开态才有分类和材质', !!D().querySelector('#deck-cats') &&
     getComputedStyle(D().querySelector('.mat-chip')).display !== 'none');
  // 展开态的三条实测坑（8-26 用户撞到的）：格子排满、能纵向滚、有得收
  const cell = D().querySelector('#deck-strip .dk-stamp');
  const strip = D().querySelector('#deck-strip');
  // ⚠️ 只比「格子 vs 列宽」是不够的：条带自己没铺满托盘时这条照样过（踩过）。
  const trayW = D().querySelector('#deck').clientWidth;
  const stripW = strip.getBoundingClientRect().width;
  ok('章条带铺满托盘', stripW > trayW - 30, `条带 ${stripW.toFixed(0)} vs 托盘 ${trayW}`);
  const cols = f.contentWindow.getComputedStyle(strip).gridTemplateColumns.split(' ').length;
  ok('一排正好 6 个', cols === 6, `实际 ${cols} 列`);
  ok('展开态章格子能纵向滚', strip.scrollHeight > strip.clientHeight + 10,
     `内容 ${strip.scrollHeight} vs 可视 ${strip.clientHeight}`);
  ok('展开态「收起」键还在', !!D().querySelector('#deck-more') &&
     f.contentWindow.getComputedStyle(D().querySelector('#deck-more')).display !== 'none');
  D().querySelector('#deck-more').click(); await sleep(320);
  ok('点「收起」能合上', !D().querySelector('#deck').classList.contains('open'));
  // 🔴 展开态的网格必须能纵向滚：纵向手势要留给滚动，不能被判成「拎起一枚章」
  //    （8-26 用户手机实测：上滑找章，每次都拿起一枚，滚不动）
  D().querySelector('#deck-more').click(); await sleep(320);
  {
    const cell0 = D().querySelector('#deck-strip .dk-stamp');
    ok('展开态格子把纵向让给滚动', f.contentWindow.getComputedStyle(cell0).touchAction === 'pan-y',
       'touch-action = ' + f.contentWindow.getComputedStyle(cell0).touchAction);
    // 纵向拖一下，不该冒出拖拽幽灵
    const rc = cell0.getBoundingClientRect();
    const pv = (t, x, y) => cell0.dispatchEvent(new f.contentWindow.PointerEvent(t,
      { bubbles: true, cancelable: true, pointerId: 7, pointerType: 'touch', clientX: x, clientY: y }));
    pv('pointerdown', rc.left + 20, rc.top + 20);
    pv('pointermove', rc.left + 22, rc.top - 60); await sleep(40);
    const ghostShown = f.contentWindow.getComputedStyle(D().querySelector('#drag-ghost')).display !== 'none';
    ok('展开态快速纵向划不会拎起章（手势归网格滚动）', !ghostShown);
    pv('pointerup', rc.left + 22, rc.top - 60); await sleep(60);
  }
  // 🔴 8-27 用户拍板的新手势：展开态**长按**才拎起来。
  //    划走 = 滚网格（上面那条），按住不动 450ms = 拎起来拖上纸。
  {
    const c2 = D().querySelectorAll('#deck-strip .dk-stamp')[2];
    const r2 = c2.getBoundingClientRect();
    const cv2 = D().querySelector('#today-canvas').getBoundingClientRect();
    const before2 = (LS('records') || []).length;
    const pv2 = (t, x, y) => c2.dispatchEvent(new f.contentWindow.PointerEvent(t,
      { bubbles: true, cancelable: true, pointerId: 11, pointerType: 'touch', clientX: x, clientY: y }));
    pv2('pointerdown', r2.left + 20, r2.top + 20);
    await sleep(120);
    const early = f.contentWindow.getComputedStyle(D().querySelector('#drag-ghost')).display !== 'none';
    ok('按住不到 450ms 还没拎起来', !early);
    await sleep(500);
    const lifted2 = f.contentWindow.getComputedStyle(D().querySelector('#drag-ghost')).display !== 'none';
    ok('展开态按住 450ms 拎起一枚章', lifted2);
    // 纸在托盘上方，长按之后拖上去应该真的落一枚
    const tx2 = cv2.left + cv2.width * 0.4, ty2 = cv2.top + cv2.height * 0.5;
    pv2('pointermove', tx2, ty2); await sleep(40);
    pv2('pointerup', tx2, ty2); await sleep(1000);
    ok('长按拖到纸上真的落了一枚', (LS('records') || []).length === before2 + 1,
       `${before2} → ${(LS('records') || []).length}`);
    D().querySelector('#undo-btn')?.click(); await sleep(200);
    ok('撤销收回（别影响后面按张数算的断言）', (LS('records') || []).length === before2);
    // 长按不该把托盘弄收起来
    ok('长按拖完托盘仍然是展开的', D().querySelector('#deck').classList.contains('open'));
  }
  // ⛔ 8-27 反过来了：展开态选完章托盘**不**自动收起（用户："实际也不应该自动收起"）。
  //    判定仍然不能用 .click()：真机是 pointerdown/up，pointerup 里就重建了 DOM，
  //    click 落不到原格子上，会得到假 PASS（8-26 踩过）。
  {
    const c9 = D().querySelectorAll('#deck-strip .dk-stamp')[8];
    const r9 = c9.getBoundingClientRect();
    const pv9 = (t, x, y) => c9.dispatchEvent(new f.contentWindow.PointerEvent(t,
      { bubbles: true, cancelable: true, pointerId: 9, pointerType: 'touch', clientX: x, clientY: y }));
    pv9('pointerdown', r9.left + 20, r9.top + 20);
    pv9('pointerup', r9.left + 20, r9.top + 20);
    await sleep(500);
    ok('展开态选完章托盘保持展开（不自动收）', D().querySelector('#deck').classList.contains('open'));
    ok('选完之后纸进入待盖状态', !!D().querySelector('#today-canvas.armed'));
    // 换印泥不需要展开：收起态点整排里的另一盒，选中的就该换过去
    D().querySelector('#deck-more').click(); await sleep(320);
    D().querySelector('#deck-inks .dk-ink[data-ink="wu"]')?.click(); await sleep(150);
    ok('收起态直接换印泥（不用展开）', !D().querySelector('#deck').classList.contains('open') &&
       !!D().querySelector('#deck-inks .dk-ink[data-ink="wu"].sel'));
  }
  if (D().querySelector('#deck').classList.contains('open')) { D().querySelector('#deck-grab').click(); await sleep(320); }
  {
    const cell1 = D().querySelector('#deck-strip .dk-stamp');
    ok('收起态仍然是手势自判（touch-action:none）',
       f.contentWindow.getComputedStyle(cell1).touchAction === 'none',
       'touch-action = ' + f.contentWindow.getComputedStyle(cell1).touchAction);
  }

  // 🔴 选章/蘸墨会整页重建，托盘的滚动位置必须留住
  //    （8-26 用户实测：展开态选第四排的章，选完弹回顶部；点印泥排最后一个，滑回最左）
  D().querySelector('#deck-more').click(); await sleep(320);
  const strip2 = D().querySelector('#deck-strip');
  strip2.scrollTop = 120; await sleep(30);
  const cells = D().querySelectorAll('#deck-strip .dk-stamp');
  cells[cells.length - 1].click(); await sleep(500);
  // ⚠️ 判据不是「滚动位置不变」——展开态选完会自动收起，纵向位置那时候没意义了。
  //    真正该保证的是：你刚选的那枚，选完之后还看得见。
  {
    const st3 = D().querySelector('#deck-strip');
    const sel3 = st3.querySelector('.dk-stamp.sel');
    const a3 = sel3.getBoundingClientRect(), b3 = st3.getBoundingClientRect();
    const visible = sel3 && a3.right > b3.left && a3.left < b3.right
      && a3.bottom > b3.top && a3.top < b3.bottom;
    ok('选完之后那枚章还看得见', !!visible,
       sel3 ? `章 ${a3.left.toFixed(0)}~${a3.right.toFixed(0)} / 条带 ${b3.left.toFixed(0)}~${b3.right.toFixed(0)}` : '没有选中的章');
  }
  D().querySelector('#deck-more')?.click(); await sleep(320);
  const inks2 = D().querySelector('#deck-inks');
  inks2.scrollLeft = 90; await sleep(30);
  const tins = D().querySelectorAll('#deck-inks .dk-ink');
  tins[tins.length - 1].click(); await sleep(400);
  ok('点印泥后横排没滑回最左', D().querySelector('#deck-inks').scrollLeft > 40,
     'scrollLeft ' + D().querySelector('#deck-inks').scrollLeft);
  if (D().querySelector('#deck').classList.contains('open')) { D().querySelector('#deck-grab').click(); await sleep(320); }
  ok('点拉手也能收起', !D().querySelector('#deck').classList.contains('open'));

  // 5. 今日页往回翻 + 补盖（8-26 用户拍板：翻页回到书里，补盖不加条件）
  const bd = D().querySelector('#backdrop'); if (bd) bd.click(); await sleep(150);
  const edge = D().querySelector('#pageedge');
  ok('今日纸底下垫着昨日页边', !!edge);
  const y = new Date(Date.now() - 864e5);
  const ydk = `${y.getFullYear()}-${String(y.getMonth()+1).padStart(2,'0')}-${String(y.getDate()).padStart(2,'0')}`;
  ok('页边指向昨天', edge && edge.dataset.dk === ydk, `got ${edge && edge.dataset.dk}`);
  // 装订在左：底下那页只能从右下的自由边露出来，而且不许转（转了整本书看着是歪的）
  const em = f.contentWindow.getComputedStyle(edge).transform.match(/matrix\(([^)]+)\)/);
  const ev = em ? em[1].split(',').map(Number) : [1, 0, 0, 1, 0, 0];
  ok('页边不歪（无旋转）', Math.abs(ev[1]) < 0.001 && Math.abs(ev[2]) < 0.001, `matrix ${ev.join(',')}`);
  // 昨天是空的时候走的是纸边叠层（.pagestack，靠 box-shadow 叠，没有 transform）
  if (edge.classList.contains('pageedge')) {
    ok('页边从右下露出来', ev[4] > 0 && ev[5] > 0, `位移 ${ev[4]},${ev[5]}`);
  } else {
    const sh = f.contentWindow.getComputedStyle(edge).boxShadow;
    ok('纸边叠层往右下叠', /(^|\s)\d+(\.\d+)?px \d+(\.\d+)?px/.test(sh), sh.slice(0, 50));
  }
  edge.click(); await sleep(900);          // 点页边 = 就地翻回昨天（转回来是一段动画）
  ok('点页边留在今日页，不跳本子', D().querySelector('#page-today').classList.contains('active'));
  ok('翻到昨天后出现「回到今天」', !!D().querySelector('#pg-today'));
  ok('纸上的日付印是昨天', D().querySelector('#today-canvas .datestamp .d').textContent.trim()
     === `${+ydk.slice(5,7)} · ${+ydk.slice(8,10)}`,
     'got ' + D().querySelector('#today-canvas .datestamp .d').textContent);

  // 在昨天那页补盖一枚：记录要归属昨天
  D().querySelector('#deck-inks .dk-ink[data-ink="zhu"]').click(); await sleep(100);
  clickAt(D().querySelector('#today-canvas'), .5, .5); await sleep(900);
  recs = LS('records') || [];
  const last = recs[recs.length - 1];
  const ldk = (t => `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`)(new Date(last.ts));
  ok('补盖的记录归属昨天', ldk === ydk, `got ${ldk} want ${ydk}`);
  ok('补盖后共 4 枚', recs.length === 4, 'got ' + recs.length);
  D().querySelector('#pg-today').click(); await sleep(200);
  ok('回到今天后没有「回到今天」钮了', !D().querySelector('#pg-today'));

  // 5a. 翻页时不能把页面撑出横向滚动（8-26 用户录屏：掀到一半整个界面横着错位）
  {
    const W2 = f.contentWindow, D2 = D();
    const main = D2.querySelector('main');
    const pp = D2.querySelector('#today-canvas'), bk = D2.querySelector('#page-today .book');
    const rr = pp.getBoundingClientRect(), yy = rr.top + rr.height * 0.6;
    const pv = (el, t, x, y) => el.dispatchEvent(new W2.PointerEvent(t,
      { bubbles: true, cancelable: true, pointerId: 9, pointerType: 'touch', clientX: x, clientY: y }));
    pv(pp, 'pointerdown', rr.left + rr.width - 40, yy);
    pv(bk, 'pointermove', rr.left + rr.width * 0.3, yy - 60); await sleep(40);
    pv(bk, 'pointermove', rr.left - 120, yy - 150); await sleep(40);
    ok('翻页中不产生横向溢出', main.scrollWidth <= main.clientWidth,
       `scrollW ${main.scrollWidth} vs clientW ${main.clientWidth}`);
    pv(bk, 'pointerup', rr.left - 120, yy - 150); await sleep(900);
  }
  // 5b. Tab 切换：查的是「到底显不显示」，不是 .active 这个类名——
  //     类名对了但页面没隐藏的情况真发生过（#page-today 的 display 被 ID 权重压住）。
  for (const t of ['memories', 'collection', 'me', 'today']) {
    D().querySelector(`#tabbar [data-tab="${t}"]`).click(); await sleep(220);
    const vis = [...D().querySelectorAll('.page')]
      .filter(p => f.contentWindow.getComputedStyle(p).display !== 'none').map(p => p.id);
    ok(`点「${t}」只显示这一页`, vis.length === 1 && vis[0] === 'page-' + t, 'got [' + vis.join(',') + ']');
  }

  // 6. 「默」薄墨不耗盒
  const padsBefore = JSON.stringify(LS('pads'));
  D().querySelector('#deck-inks .dk-ink[data-ink=""]').click(); await sleep(100);
  ok('蘸「默」不扣任何盒', JSON.stringify(LS('pads')) === padsBefore);

  ok('全程页面没抛异常', errs.length === 0, errs.join(' | '));
  // 7. 本子页底部「这一天」不能被章的数量撑长
  //    （8-26 用户："如果这一天盖了很多章，就又是很长"。改之前 20 枚 ≈ 1080px）
  {
    const many = JSON.parse(localStorage.getItem('lifestamps_records') || '[]');
    const base = new Date();
    for (let i = 0; i < 20; i++) {
      const d2 = new Date(base); d2.setHours(8 + (i % 12), (i * 3) % 60, 0, 0);
      many.push({ id: 'bulk' + i, stampId: 'milktea', ink: 'zhu', mat: 'r', ts: d2.getTime(),
                  rot: -3, sc: 1, op: .9, seed: i, px: 20 + (i * 3) % 60, py: 20 + (i * 5) % 60 });
    }
    localStorage.setItem('lifestamps_records', JSON.stringify(many));
    f.src = '../index.html?skipob=1&noopen=1&band=day&tab=memories';
    await new Promise(r => f.onload = r); await sleep(500);
    const grid = D().querySelector('.day-grid');
    const panel = D().querySelector('.day-panel');
    ok('这一天有 20+ 枚章时明细仍然封顶', grid && grid.clientHeight <= 140,
       grid ? `可视 ${grid.clientHeight}px / 内容 ${grid.scrollHeight}px` : '没找到明细网格');
    ok('超出的部分在块内滚动而不是撑长页面', grid && grid.scrollHeight > grid.clientHeight,
       grid ? `内容 ${grid.scrollHeight} vs 可视 ${grid.clientHeight}` : '');
    ok('整块「这一天」高度受控（<220px）', panel && panel.getBoundingClientRect().height < 220,
       panel ? Math.round(panel.getBoundingClientRect().height) + 'px' : '');
  }

  // 8.「写一句话」的可发现性（「盖了么」#1：功能一直有，但没人知道它在那儿）
  //   规矩：刚盖下的那枚旁边浮个小提示；写过一次之后不再提示（知道了就不用再教）。
  {
    localStorage.clear();
    localStorage.setItem('lifestamps_settings', JSON.stringify({ sound: false, haptic: true, onboarded: true, cover: 'rose' }));
    localStorage.setItem('lifestamps_bookClosed', 'false');
    f.src = '../index.html?skipob=1&noopen=1&band=day&sel=milktea';
    await new Promise(r => f.onload = r); await sleep(500);
    clickAt(D().querySelector('#today-canvas'), .4, .4); await sleep(1000);
    const hint = D().querySelector('.note-hint');
    ok('第一次盖章会提示「写一句」', !!hint, hint ? hint.textContent : '没提示');
    hint?.click(); await sleep(250);
    const inp = D().querySelector('.note-pop .np-in');
    ok('点提示能就地打开写字气泡', !!inp);
    if (inp) { inp.value = '和小周去的'; inp.dispatchEvent(new Event('blur')); await sleep(400); }
    ok('写的话存进了那枚印记', (LS('records') || []).some(r => r.note === '和小周去的'));
    clickAt(D().querySelector('#today-canvas'), .7, .6); await sleep(1100);
    ok('写过之后不再提示', !D().querySelector('.note-hint'));
  }

  // 9. 字形章（「盖了么」#3）：能盖，但绝不进"收集"统计
  {
    localStorage.clear();
    localStorage.setItem('lifestamps_settings', JSON.stringify({ sound: false, haptic: true, onboarded: true, cover: 'rose' }));
    localStorage.setItem('lifestamps_bookClosed', 'false');
    f.src = '../index.html?skipob=1&noopen=1&band=day&deck=open&cat=glyph';
    await new Promise(r => f.onload = r); await sleep(500);
    const W = f.contentWindow;
    const two = [...D().querySelectorAll('#deck-strip .dk-stamp')].find(e => e.dataset.sid === 'g2');
    ok('托盘「字」这一类里有数字 2', !!two);
    // ⚠️ 选章发生在 pointerup 里，合成 .click() 不走那条路（踩过）
    const rr = two.getBoundingClientRect();
    const pv = t => two.dispatchEvent(new W.PointerEvent(t,
      { bubbles: true, cancelable: true, pointerId: 3, pointerType: 'touch', clientX: rr.left + 10, clientY: rr.top + 10 }));
    pv('pointerdown'); pv('pointerup'); await sleep(400);
    clickAt(D().querySelector('#today-canvas'), .6, .5); await sleep(900);
    ok('数字章能盖到纸上', (LS('records') || []).some(r => r.stampId === 'g2'));
    const disc = LS('discovered') || {};
    ok('字形章不进 discovered（不算发现）', !disc.g2, '实际 ' + JSON.stringify(Object.keys(disc)));
    D().querySelector('#tabbar [data-tab="collection"]').click(); await sleep(400);
    const sub = D().querySelector('#page-collection .col-sub').textContent;
    // ⚠️ 8-27 文案从「用过 N 枚，还有 M 枚没盖过」改成「已经盖过 N 枚」，判据跟着改；
    //    但**要防的事没变**：刚盖了一枚字形章，这个数不许把 49 枚字算进去。
    //    所以量的是数字本身——被字撑爆的话会是 49+。
    {
      const n = +(sub.match(/\d+/) || [99])[0];
      ok('抽屉统计没被 49 枚字撑爆', n < 10, sub.trim() + `（取到 ${n}）`);
    }
    // 「字」要跟托盘的分类栏一致地出现在抽屉上方（8-27 用户直接问了"为什么不在上方"）
    const gchip = D().querySelector('#drawer-cats [data-dcat="glyph"]');
    ok('抽屉分类栏里有「字」', !!gchip);
    gchip?.click(); await sleep(350);
    ok('点「字」主区就是 49 枚字形章', D().querySelectorAll('#page-collection .dk-cell').length === 49,
       '实际 ' + D().querySelectorAll('#page-collection .dk-cell').length + ' 枚');
    ok('选「字」时两折藏起来（那两折说的是生活章）', !D().querySelector('[data-fold="raw"]'));
  }

  // 10. 贴纸拖到封面上（3.1）：贴住 → 刷新还在 → 拖出去揭下来
  {
    localStorage.clear();
    localStorage.setItem('lifestamps_settings', JSON.stringify({ sound: false, haptic: true, onboarded: true, cover: 'rose' }));
    localStorage.setItem('lifestamps_bookClosed', 'true');
    const n2 = new Date(), mk = n2.getFullYear() + '-' + String(n2.getMonth() + 1).padStart(2, '0');
    localStorage.setItem('lifestamps_records', JSON.stringify([{ id: 'a', stampId: 'milktea', ink: 'zhu', mat: 'r', ts: n2.getTime(), rot: -3, sc: 1, op: .9, seed: 3, px: 25, py: 30 }]));
    localStorage.setItem('lifestamps_discovered', JSON.stringify({ milktea: n2.getTime(), coffee: n2.getTime(), water: n2.getTime() }));
    f.src = '../index.html?skipob=1&noopen=1&band=day&opening=1';
    await new Promise(r => f.onload = r); await sleep(800);
    const W2 = f.contentWindow;
    const loose = D().querySelectorAll('.loose-sticker');
    ok('桌上摆着还没贴的贴纸', loose.length > 0, loose.length + ' 张');
    const el = loose[0], sid = el.dataset.sid;
    const before = D().querySelectorAll('.op-cover .op-sticker').length;
    const r0 = el.getBoundingClientRect(), cr = D().querySelector('.op-cover').getBoundingClientRect();
    const pv2 = (t, x, y) => el.dispatchEvent(new W2.PointerEvent(t,
      { bubbles: true, cancelable: true, pointerId: 4, pointerType: 'touch', clientX: x, clientY: y }));
    pv2('pointerdown', r0.left + 10, r0.top + 10);
    pv2('pointermove', r0.left + 40, r0.top - 40); await sleep(50);
    pv2('pointermove', cr.left + cr.width * .6, cr.top + cr.height * .7); await sleep(50);
    pv2('pointerup', cr.left + cr.width * .6, cr.top + cr.height * .7); await sleep(250);
    ok('拖到封面上就贴住了', D().querySelectorAll('.op-cover .op-sticker').length === before + 1);
    // 🔴 在贴纸上"点一下不拖"也不许翻开本子——只靠"刚拖完不算"的时间护栏挡不住这种
    //    （位移<6px 时那个护栏根本不触发，8-27 用户实测"贴来贴去偶尔会直接翻页"）
    {
      const l2 = D().querySelector('.loose-sticker');
      if (l2) {
        const rl = l2.getBoundingClientRect();
        const pv3 = (t, x, y) => l2.dispatchEvent(new W2.PointerEvent(t,
          { bubbles: true, cancelable: true, pointerId: 8, pointerType: 'touch', clientX: x, clientY: y }));
        pv3('pointerdown', rl.left + 8, rl.top + 8);
        pv3('pointermove', rl.left + 10, rl.top + 9); await sleep(30);
        pv3('pointerup', rl.left + 10, rl.top + 9);
        l2.dispatchEvent(new W2.MouseEvent('click', { bubbles: true }));
        await sleep(400);
        ok('在贴纸上点一下不会把本子翻开', !!D().querySelector('#opening'));
      }
    }
    ok('拖贴纸不会误把本子翻开', !!D().querySelector('#opening'));
    const st = JSON.parse(localStorage.getItem('lifestamps_stickers') || '{}');
    ok('位置存下来且标了 manual', (st[mk] || []).some(x => x.id === sid && x.manual));
    // 🔴 它不在「当月最常盖」里，全靠 manual 标记才不被自动布局清掉
    f.src = '../index.html?skipob=1&noopen=1&band=day&opening=1';
    await new Promise(r => f.onload = r); await sleep(800);
    ok('刷新之后那张还贴在封面上',
       [...D().querySelectorAll('.op-cover .op-sticker')].some(x => x.dataset.sid === sid));
  }

  O.innerHTML = out.join('') + `<div style="margin-top:8px">${out.filter(x=>x.includes('FAIL')).length ? 'HAS FAIL' : 'ALL PASS'}</div>`;
})().catch(e => { O.innerHTML = out.join('') + `<div class="f">CRASH: ${e.message}</div>`; });
</script>
