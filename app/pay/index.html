<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F2EA">
<title>戳了么</title>
<meta name="robots" content="noindex">
<!-- 支付宝付完（或中途退出）跳回来的落点：return_url / quit_url 都指这里（server/pay.js）。
     🔴 这一页**只给人看**，不做任何到账判断——支付宝带回来的 out_trade_no / total_amount 等参数一个字不信。
        到账是 App 里 checkPendingOrder 去问服务端（notify 验签 / 主动反查）的事。
     安卓官网直装包：付款发生在系统浏览器里，用户看完这页自己切回 App；
     网页版：点按钮回到 ../ 即可，App 开机会查挂着的单。 -->
<style>
@font-face{font-family:"Xiaolai";src:url("../fonts/xiaolai.woff2") format("woff2");font-display:swap}
@font-face{font-family:"LXGW WenKai";src:url("../fonts/lxgw-wenkai.woff2") format("woff2");font-display:swap}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  min-height:100dvh; background:#F6F2EA; color:#252421;
  font-family:"Xiaolai","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:40px 26px; text-align:center;
}
h1{font-family:"LXGW WenKai",serif;font-size:26px;letter-spacing:.12em;font-weight:400;margin-top:14px}
.sub{font-family:"LXGW WenKai",serif;font-size:15.5px;color:#6B655C;line-height:1.9;margin-top:12px;max-width:18em}
.cta{display:inline-block;margin-top:30px;padding:15px 40px;border-radius:10px;background:#C94B3C;color:#FBF7EE;text-decoration:none;font-size:16px;letter-spacing:.1em}
.mark{width:72px;height:72px}
.note{font-size:12.5px;color:#8C8880;margin-top:26px;line-height:1.8}
</style>
</head>
<body>
<svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="42" fill="none" stroke="#C94B3C" stroke-width="5"/><path d="M32,52 L45,64 L70,36" fill="none" stroke="#C94B3C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
<h1 id="t">付款完成后，回到戳了么就好</h1>
<p class="sub" id="s">印泥盒会在你回到 App 的时候打开。<br>要是没马上出现，进印泥盒点一下「我已付款」。</p>
<a class="cta" id="back" href="../">回到戳了么</a>
<p class="note" id="n"></p>
<script>
/* i18n-exempt:start —— 这一页跑在支付宝跳回来的浏览器里，不加载 App 的字典 */
(function () {
  var q = new URLSearchParams(location.search);
  var no = q.get('out_trade_no') || '';
  if (no) document.getElementById('n').textContent = '订单 ' + no;
  // 安卓壳外开的系统浏览器里没有 App 的会话，这页给不了"回到 App"的深链——
  // 用户按返回 / 最近任务切回去即可；「回到戳了么」那颗按钮是给网页版的。
})();
/* i18n-exempt:end */
</script>
</body>
</html>
